# geoflow_templates/direct_scope_metric.yaml
# 사용자가 scope 값을 직접 제시한 경우. get_place_scope를 거치지 않는다.
# scope slot 값이 실제 사용자 발화에 있었는지는 Validator(G6)가 확인한다.

name: DIRECT_SCOPE_METRIC
description: 사용자가 scope 값을 직접 제시한 구간의 통행(passage) 통계값을 구한다.
question_examples:
  - "2026년 5월 30일 오후 12시에서 1시사이에 scope:edge:1742상의 택시들의 평균 속도는?"

required_slots: [scope, metric]
optional_slots: [aggregation, date, time]
slot_types:
  scope: scope
  metric:
    enum: [speed, rpm]
  aggregation:
    enum: [max, min, sum, avg, med]
  date: date
  time: time

concepts:
  - id: user_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: user
    from_slot: scope
  - id: measure
    concept: AMOUNT
    subtype: speed
    by_slot:
      slot: metric
      cases:
        speed: {concept: AMOUNT, subtype: speed}
        rpm: {concept: AMOUNT, subtype: rpm}
    role: MEASURE
    source: tool

transformations:
  - id: passage_metric
    operator: PASSAGE_METRIC
    inputs:
      area: {node: user_scope}
    params:
      metric: {slot: metric}
      aggregation: {slot: aggregation}
      date: {slot: date}
      time: {slot: time}
    outputs: [measure]

final_node: measure

answer:
  kind: metric
  label: 통행 통계값
