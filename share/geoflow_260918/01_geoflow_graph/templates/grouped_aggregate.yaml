# geoflow_templates/grouped_aggregate.yaml
# 일 단위 영업(operation) 통계를 dimension 기준으로 그룹화한 분포.
# taxi_type/date 같은 filter는 transformation params로 표현한다.

name: GROUPED_AGGREGATE
description: 일 단위 택시 영업(operation) 통계를 요일별·지역별 등으로 그룹화한 분포를 구한다.
question_examples:
  - "개인용 택시의 요일별 택시 수입 분포는?"

required_slots: [metric, dimension]
optional_slots: [taxi_type, date, aggregation, order, limit]
slot_types:
  metric:
    enum: [revenue, operating_count, operating_ratio, hours]
  dimension:
    enum: [dayofweek, sido]
  taxi_type:
    enum: [private, corporate, all]
  date: date
  aggregation:
    enum: [max, min, sum, avg, med]
  order:
    enum: [top, bottom]
  limit: integer

concepts:
  - id: measure
    concept: AMOUNT
    subtype: revenue
    by_slot:
      slot: metric
      cases:
        revenue: {concept: AMOUNT, subtype: revenue}
        operating_count: {concept: AMOUNT, subtype: operating_count}
        hours: {concept: AMOUNT, subtype: hours}
        operating_ratio: {concept: PROPORTION, subtype: operating_ratio}
    role: MEASURE
    source: tool

transformations:
  - id: operation_metric
    operator: OPERATION_METRIC
    params:
      metric: {slot: metric}
      dimension: {slot: dimension}
      taxi_type: {slot: taxi_type}
      date: {slot: date}
      aggregation: {slot: aggregation}
      order: {slot: order}
      limit: {slot: limit}
    outputs: [measure]

final_node: measure

answer:
  kind: distribution
  label: 영업 통계 분포
