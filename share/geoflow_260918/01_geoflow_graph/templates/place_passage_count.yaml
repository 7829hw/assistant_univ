# geoflow_templates/place_passage_count.yaml
# 장소/지역 내부의 통행량(passage 건수). 주변 영역은 포함하지 않는다.
# DIRECT_SCOPE_PASSAGE_COUNT / VICINITY_PASSAGE_COUNT와 함께 scope 확보 경로의
# 세 갈래를 이룬다.

name: PLACE_PASSAGE_COUNT
description: >-
  장소 또는 지역 범위 내부의 통행량(통과 차량 대수)을 센다. 주변 영역은 포함하지 않는다.
  dimension을 지정하면 그 단위로 나눈 분포를, 지정하지 않으면 단일 값을 반환한다.
question_examples:
  - "대구 지역 전체 통행량은?"
  - "대구 시군구별 통행량은?"
  - "대구에서 통행량이 가장 많은 시군구 3곳은?"

# get_passage_count는 scope가 필수이므로 place도 필수다. 지역이 주어지지 않은
# 순위 질의("통행량이 가장 많은 시군구 3곳은?")는 scope를 확보할 수 없어
# 이 template으로도 표현할 수 없다.
required_slots: [place]
optional_slots: [dimension, order, limit, date, time, taxi_type, taxi_status]
# order/limit은 dimension이 지정된 경우에만 의미를 가진다.
slot_requires:
  order: [dimension]
  limit: [dimension]

slot_types:
  place: place
  dimension:
    enum: [h3, sido, sigungu, emd]
  order:
    enum: [top, bottom]
  limit: integer
  date: date
  time: time
  taxi_type:
    enum: [private, corporate, all]
  taxi_status:
    enum: [occupied, vacant, stationary, all]

concepts:
  - id: place
    concept: LOCATION
    subtype: place
    role: SUBCOND
    source: user
    from_slot: place
  - id: place_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: tool
  - id: passage_count
    concept: AMOUNT
    subtype: passage_count
    role: MEASURE
    source: tool

transformations:
  - id: resolve_place
    operator: RESOLVE_PLACE_SCOPE
    inputs:
      place_name: {node: place, field: name}
      place_region: {node: place, field: region}
    params:
      include_vicinity: false
    outputs: [place_scope]

  - id: count_passages
    operator: PASSAGE_COUNT
    inputs:
      area: {node: place_scope}
    params:
      dimension: {slot: dimension}
      order: {slot: order}
      limit: {slot: limit}
      date: {slot: date}
      time: {slot: time}
      taxi_type: {slot: taxi_type}
      taxi_status: {slot: taxi_status}
    outputs: [passage_count]

final_node: passage_count

answer:
  kind: count
  label: 통행량
  unit: 건
