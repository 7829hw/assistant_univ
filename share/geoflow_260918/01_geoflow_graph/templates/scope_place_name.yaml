# geoflow_templates/scope_place_name.yaml
# scope → 장소명 역변환. 사용자가 scope 값을 들고 와 "여기가 어디냐"고 묻는 경우.
# 집계 결과의 scope에 이름을 붙이는 것은 template이 아니라 실행 후 labeling
# 단계(geoflow/labeling.py)가 담당한다. 둘은 목적이 다르다.

name: SCOPE_PLACE_NAME
description: 사용자가 제시한 scope에 해당하는 장소명을 찾는다. 통계값을 구하지 않는다.
question_examples:
  - "scope:district:2700000000은 어디인가요?"
  - "scope:edge:1742는 무슨 도로인가요?"

required_slots: [scope]
optional_slots: []
slot_types:
  scope: scope

concepts:
  - id: user_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: user
    from_slot: scope
  - id: place
    concept: LOCATION
    subtype: place
    role: MEASURE
    source: tool

transformations:
  - id: resolve_name
    operator: SCOPE_NAME
    inputs:
      area: {node: user_scope}
    outputs: [place]

final_node: place

answer:
  kind: metric
  label: 장소명
