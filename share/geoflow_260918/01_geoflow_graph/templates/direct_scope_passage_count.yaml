# geoflow_templates/direct_scope_passage_count.yaml
# 사용자가 scope를 직접 제시한 지점/구간의 통행량(passage 건수).

name: DIRECT_SCOPE_PASSAGE_COUNT
description: 사용자가 scope 값을 직접 제시한 지점/구간의 통행량(통과 차량 대수)을 센다.
question_examples:
  - "2026년 5월 30일 오후 12시에서 1시사이에 scope:edge:19384 지점을 통과하는 차량 대수는 몇대?"

required_slots: [scope]
optional_slots: [date, time, taxi_type, taxi_status]
slot_types:
  scope: scope
  date: date
  time: time
  taxi_type:
    enum: [private, corporate, all]
  taxi_status:
    enum: [occupied, vacant, stationary, all]

concepts:
  - id: user_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: user
    from_slot: scope
  - id: passage_count
    concept: AMOUNT
    subtype: passage_count
    role: MEASURE
    source: tool

transformations:
  - id: count_passages
    operator: PASSAGE_COUNT
    inputs:
      area: {node: user_scope}
    params:
      date: {slot: date}
      time: {slot: time}
      taxi_type: {slot: taxi_type}
      taxi_status: {slot: taxi_status}
    outputs: [passage_count]

final_node: passage_count

answer:
  kind: count
  label: 통행량
  unit: 건
