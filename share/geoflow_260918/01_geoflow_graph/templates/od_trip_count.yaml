# geoflow_templates/od_trip_count.yaml
# 출발지/도착지가 모두 주어진 실차 구간(trip) 건수.
# origin→scope_pickup, destination→scope_dropoff 고정 binding은 template과
# operator_registry가 결정하며 Planner는 관여하지 않는다.

name: OD_TRIP_COUNT
description: 출발지와 도착지가 모두 주어진 실차 구간(trip) 건수를 센다.
question_examples:
  - "대구 동성로동에서 출발하여 신천동에 도착한 실차 구간 건수는?"

# destination을 필수로 두면 "A에서 출발한 건수" 같은 질문에서 Planner가 빈
# 문자열이나 "모든 지역" 같은 가짜 장소를 지어내 필수 slot을 채우려 한다.
# get_trip_count는 승차 위치만으로도 집계할 수 있으므로 optional로 둔다.
required_slots: [origin]
optional_slots: [destination, date, time]
slot_types:
  origin: place
  destination: place
  date: date
  time: time

concepts:
  - id: origin
    concept: LOCATION
    subtype: place
    role: SUBCOND
    source: user
    from_slot: origin
  - id: destination
    concept: LOCATION
    subtype: place
    role: SUBCOND
    source: user
    from_slot: destination
    optional: true
  - id: origin_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: tool
  - id: destination_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: tool
    optional: true
  - id: trip_count
    concept: AMOUNT
    subtype: trip_count
    role: MEASURE
    source: tool

transformations:
  - id: resolve_origin
    operator: RESOLVE_PLACE_SCOPE
    inputs:
      place_name: {node: origin, field: name}
      place_region: {node: origin, field: region}
    params:
      include_vicinity: false
    outputs: [origin_scope]

  - id: resolve_destination
    operator: RESOLVE_PLACE_SCOPE
    inputs:
      place_name: {node: destination, field: name}
      place_region: {node: destination, field: region}
    params:
      include_vicinity: false
    outputs: [destination_scope]

  - id: count_trips
    operator: TRIP_COUNT
    inputs:
      pickup: {node: origin_scope}
      dropoff: {node: destination_scope}
    params:
      date: {slot: date}
      time: {slot: time}
    outputs: [trip_count]

final_node: trip_count

answer:
  kind: count
  label: 실차 구간 건수
  unit: 건
