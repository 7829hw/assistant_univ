question: 부산 초읍동에서 출발하여 초량동에 도착한 실차 구간 건수는?
template: OD_TRIP_COUNT
geoflow_plan:
  version: '1.0'
  question: 부산 초읍동에서 출발하여 초량동에 도착한 실차 구간 건수는?
  template: OD_TRIP_COUNT
  slots:
    origin:
      name: 초읍동
      region: 부산
    destination:
      name: 초량동
      region: ''
  concepts:
  - id: origin
    concept: LOCATION
    subtype: place
    role: SUBCOND
    source: user
    value:
      name: 초읍동
      region: 부산
    attributes: {}
  - id: destination
    concept: LOCATION
    subtype: place
    role: SUBCOND
    source: user
    value:
      name: 초량동
      region: ''
    attributes: {}
  - id: origin_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: tool
    value: null
    attributes: {}
  - id: destination_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: tool
    value: null
    attributes: {}
  - id: trip_count
    concept: AMOUNT
    subtype: trip_count
    role: MEASURE
    source: tool
    value: null
    attributes: {}
  transformations:
  - id: resolve_origin
    operator: RESOLVE_PLACE_SCOPE
    inputs:
      place_name:
        $ref: origin
        field: name
      place_region:
        $ref: origin
        field: region
    outputs:
    - origin_scope
    params:
      include_vicinity: false
  - id: resolve_destination
    operator: RESOLVE_PLACE_SCOPE
    inputs:
      place_name:
        $ref: destination
        field: name
      place_region:
        $ref: destination
        field: region
    outputs:
    - destination_scope
    params:
      include_vicinity: false
  - id: count_trips
    operator: TRIP_COUNT
    inputs:
      pickup:
        $ref: origin_scope
        field: null
      dropoff:
        $ref: destination_scope
        field: null
    outputs:
    - trip_count
    params: {}
  final_node: trip_count
validation:
  status: OK
  template: OD_TRIP_COUNT
  checked_rules:
  - G1_ACYCLICITY
  - G2_ROLE_ORDERING
  - G3_TYPE_COMPATIBILITY
  - G4_EXECUTABILITY
  - G5_CONNECTIVITY
  - G6_SCOPE_PROVENANCE
  failed_rules: []
  errors: []
  topological_order:
  - resolve_origin
  - resolve_destination
  - count_trips
execution_plan:
  template: OD_TRIP_COUNT
  final_node: trip_count
  steps:
  - id: resolve_origin
    operator: RESOLVE_PLACE_SCOPE
    tool_name: get_place_scope
    arguments:
      name: 초읍동
      region: 부산
      include_vicinity: false
    output_bindings:
      scope: origin_scope
  - id: resolve_destination
    operator: RESOLVE_PLACE_SCOPE
    tool_name: get_place_scope
    arguments:
      name: 초량동
      include_vicinity: false
    output_bindings:
      scope: destination_scope
  - id: count_trips
    operator: TRIP_COUNT
    tool_name: get_trip_count
    arguments:
      scope_pickup:
        $ref: origin_scope
        field: null
      scope_dropoff:
        $ref: destination_scope
        field: null
    output_bindings:
      $: trip_count
