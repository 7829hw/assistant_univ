question: 대구 동성로길의 평균 속도는?
template: PLACE_SCOPE_METRIC
geoflow_plan:
  version: '1.0'
  question: 대구 동성로길의 평균 속도는?
  template: PLACE_SCOPE_METRIC
  slots:
    place:
      name: 동성로
      region: 대구
    metric: speed
    aggregation: avg
  concepts:
  - id: place
    concept: LOCATION
    subtype: place
    role: SUBCOND
    source: user
    value:
      name: 동성로
      region: 대구
    attributes: {}
  - id: place_scope
    concept: LOCATION
    subtype: scope
    role: COND
    source: tool
    value: null
    attributes: {}
  - id: measure
    concept: AMOUNT
    subtype: speed
    role: MEASURE
    source: tool
    value: null
    attributes: {}
  transformations:
  - id: resolve_place
    operator: RESOLVE_PLACE_SCOPE
    inputs:
      place_name:
        $ref: place
        field: name
      place_region:
        $ref: place
        field: region
    outputs:
    - place_scope
    params:
      include_vicinity: false
  - id: passage_metric
    operator: PASSAGE_METRIC
    inputs:
      area:
        $ref: place_scope
        field: null
    outputs:
    - measure
    params:
      metric: speed
      aggregation: avg
  final_node: measure
validation:
  status: OK
  template: PLACE_SCOPE_METRIC
  checked_rules:
  - G1_ACYCLICITY
  - G2_ROLE_ORDERING
  - G3_TYPE_COMPATIBILITY
  - G4_EXECUTABILITY
  - G5_CONNECTIVITY
  - G6_SCOPE_PROVENANCE
  failed_rules: []
  errors: []
  topological_order:
  - resolve_place
  - passage_metric
execution_plan:
  template: PLACE_SCOPE_METRIC
  final_node: measure
  steps:
  - id: resolve_place
    operator: RESOLVE_PLACE_SCOPE
    tool_name: get_place_scope
    arguments:
      name: 동성로
      region: 대구
      include_vicinity: false
    output_bindings:
      scope: place_scope
  - id: passage_metric
    operator: PASSAGE_METRIC
    tool_name: get_passage_metrics
    arguments:
      scope:
        $ref: place_scope
        field: null
      metric: speed
      aggregation: avg
    output_bindings:
      $: measure
repair:
  repair_count: 1
  attempts:
  - index: 0
    status: TOOL_ERROR
    slots:
      place:
        name: 동성로길
        region: 대구
      metric: speed
      aggregation: avg
    error: 'Tool 오류(get_place_scope/NOT_FOUND): 일치하는 장소 또는 행정구역을 찾을 수 없습니다.'
  - index: 1
    status: OK
    slots:
      place:
        name: 동성로
        region: 대구
      metric: speed
      aggregation: avg
