- id: ex14
  version: 1
  question: 2026년 7월부터 8월까지 가람구 개인택시의 월별 매출 합계 평균은?
  grounding:
    concepts:
    - id: place
      text: 가람구
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 가람구
        region: ''
    - id: operation
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: revenue
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: 20260701-20260831
      aggregation_plan:
        bucket:
          unit: month
          reducer: sum
        result:
          reducer: avg
      taxi_type: private
  graph:
  - place(LOCATION/place, SUBCOND) --RESOLVE_PLACE_SCOPE[include_vicinity=False]--> place_scope(LOCATION/scope, COND)
  - 'operation(EVENT/operation, SUPPORT) + place_scope --OPERATION_METRIC[aggregation=sum; metric=revenue; 조건: date, taxi_type]--> revenue_groups(AMOUNT/revenue, SUPPORT, 구간=month)'
  - revenue_groups --REDUCE_GROUPS[reducer=avg]--> revenue(AMOUNT/revenue, MEASURE)
  macros:
  - PLACE_TO_SCOPE
  - EVENT_TO_GROUPED_MEASURE
  result_kind: scalar
  aggregation:
    bucket: month
    inner: sum
    outer: avg
    select: null
  expected_outcome: answered
  note: '''월별 합계 평균'' → bucket.unit=month, 구간 안 sum, 구간별 값 avg. 구간 단위는 bucket에만 적는다.'
  reference:
    provider: reference
    reference_date: '2026-09-25'
    value: 1119500
    basis: reference_data/synthetic_operation_days.csv를 손으로 센 값(tests/test_example_store.py가 독립 SQL로 대조)
  tags:
  - avg_of_bucket_sums
  source: authored:2026-09-26
  split: retrieval_store
  reviewed_by: claude-2026-09-26 (사용자 검토 전)
- id: ex15
  version: 1
  question: 지난달 달서구 개인택시 주별 운행 시간 평균들의 평균은?
  grounding:
    concepts:
    - id: place
      text: 달서구
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 달서구
        region: ''
    - id: operation
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: hours
      concept: AMOUNT
      subtype: hours
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      aggregation_plan:
        bucket:
          unit: week
          reducer: avg
        result:
          reducer: avg
      taxi_type: private
  graph:
  - place(LOCATION/place, SUBCOND) --RESOLVE_PLACE_SCOPE[include_vicinity=False]--> place_scope(LOCATION/scope, COND)
  - 'operation(EVENT/operation, SUPPORT) + place_scope --OPERATION_METRIC[aggregation=avg; metric=hours; 조건: date, taxi_type]--> hours_groups(AMOUNT/hours, SUPPORT, 구간=week)'
  - hours_groups --REDUCE_GROUPS[reducer=avg]--> hours(AMOUNT/hours, MEASURE)
  macros:
  - PLACE_TO_SCOPE
  - EVENT_TO_GROUPED_MEASURE
  result_kind: scalar
  aggregation:
    bucket: week
    inner: avg
    outer: avg
    select: null
  expected_outcome: answered
  note: '''주별 평균들의 평균'' → 구간 안 avg, 구간별 값 avg. 구간 없는 전체 평균(result.reducer=avg)과 다른 계산이다.'
  tags:
  - avg_of_bucket_avgs
  source: authored:2026-09-26
  split: retrieval_store
  reviewed_by: claude-2026-09-26 (사용자 검토 전)
- id: ex16
  version: 1
  question: 2026년 9월 10일 대구 개인택시 매출 평균이 높은 구·군 3곳은?
  grounding:
    concepts:
    - id: place
      text: 대구
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 대구
        region: ''
    - id: operation
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: revenue
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: '20260910'
      dimension: sigungu
      order: top
      limit: 3
      aggregation_plan:
        result:
          reducer: avg
      taxi_type: private
  graph:
  - place(LOCATION/place, SUBCOND) --RESOLVE_PLACE_SCOPE[include_vicinity=False]--> place_scope(LOCATION/scope, COND)
  - 'operation(EVENT/operation, SUPPORT) + place_scope --OPERATION_METRIC[aggregation=avg; dimension=sigungu; limit=3; metric=revenue; order=top; 조건: date, taxi_type]--> revenue(AMOUNT/revenue, MEASURE)'
  macros:
  - PLACE_TO_SCOPE
  - EVENT_TO_MEASURE
  result_kind: dimension_groups
  aggregation:
    bucket: null
    inner: avg
    outer: null
    select: null
  expected_outcome: answered
  note: 지역(구·군)으로 나눈 순위 → dimension=sigungu, order=top, limit=3. 주·월 같은 시간 구간은 dimension·order·limit이 아니라 aggregation_plan.bucket에 적는다.
  tags:
  - dimension_ranking
  source: authored:2026-09-26
  split: retrieval_store
  reviewed_by: claude-2026-09-26 (사용자 검토 전)
