  grounding: *id001
  result_kind: grouped_values
  aggregation: {}
  expected_outcome: unsupported
  expected_error: UNSUPPORTED_QUESTION
  note: '달마다 값을 나열하는 목록 질문 → {"unsupported": true}. 최종 집계나 select를 지어내지 않는다.'
  tags:
