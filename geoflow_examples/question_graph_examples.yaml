# 질문–의미 graph 예시 저장소(geoflow/examples.py). 논문 부록 E.1의 example store에 해당한다.
#
# - 모든 예시는 2026-09-26에 새로 쓴 학습용 문장이다. 평가 질문, 그 paraphrase, 지역명만 바꾼
#   변형을 넣지 않는다. 기능 확인 6문항(evaluation/reference/reference_questions_v1.yaml)도
#   넣지 않는다. 모델 출력을 예시로 옮기지 않았다.
# - reference 예시(가람구·나래구, 합성 데이터)는 기대 결과를 손으로 센 값으로 적고, 등록 검증이
#   reference provider에서 실제로 계산해 맞춘다. 나머지 지명은 조합·검증용이며 실행하지 않는다.
# - graph·macros·aggregation은 grounding에서 composer가 만든 것과 같아야 한다(등록 검증).
# - 내용을 바꾸면 해당 예시의 version을 올리고 index를 다시 만든다(python example_retrieval.py build).
# - 질문 의미에 대한 정답 여부는 사람이 검토한다(reviewed_by). 등록 검증은 형식·실행 검증이다.
version: 1
examples:
- id: ex01
  version: 1
  question: 지난달 중구 법인택시의 운행 시간 평균은?
  grounding:
    concepts:
    - id: place
      text: 중구
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 중구
        region: ''
    - id: operation
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: hours
      concept: AMOUNT
      subtype: hours
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      aggregation_plan:
        result:
          reducer: avg
      taxi_type: corporate
  graph:
  - place(LOCATION/place, SUBCOND) --RESOLVE_PLACE_SCOPE[include_vicinity=False]--> place_scope(LOCATION/scope, COND)
  - 'operation(EVENT/operation, SUPPORT) + place_scope --OPERATION_METRIC[aggregation=avg; metric=hours; 조건: date, taxi_type]--> hours(AMOUNT/hours, MEASURE)'
  macros:
  - PLACE_TO_SCOPE
  - EVENT_TO_MEASURE
  result_kind: scalar
  aggregation:
    bucket: null
    inner: avg
    outer: null
    select: null
  expected_outcome: answered
  note: 구간 표현이 없다. 전체 레코드의 평균 한 단계 → result.reducer=avg. bucket을 넣지 않는다.
  tags:
  - overall_average
  source: authored:2026-09-26
  split: retrieval_store
  reviewed_by: claude-2026-09-26 (사용자 검토 전)
