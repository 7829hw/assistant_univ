        bucket:
          unit: week
          reducer: sum
        result:
          reducer: avg
      taxi_type: private
  graph:
  - place(LOCATION/place, SUBCOND) --RESOLVE_PLACE_SCOPE[include_vicinity=False]--> place_scope(LOCATION/scope, COND)
  - 'operation(EVENT/operation, SUPPORT) + place_scope --OPERATION_METRIC[aggregation=sum; metric=hours; 조건: date, taxi_type]--> hours_groups(AMOUNT/hours, SUPPORT, 구간=week)'
  - hours_groups --REDUCE_GROUPS[reducer=avg]--> hours(AMOUNT/hours, MEASURE)
  macros:
