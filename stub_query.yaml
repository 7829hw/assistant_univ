# expected_concepts / expected_macros / expected_operators는 geoflow 모드의
# 정확도 측정용 정답 라벨이다. react 모드와 query_loader는 이 key를 사용하지
# 않는다.
#
# expected_concepts는 "CONCEPT/subtype:ROLE" 형식이다. id는 모델이 정하는
# 이름이라 정답과 맞출 수 없으므로 의미만 적는다.
# expected_macros는 하나의 완성 template이 아니라 합성에 쓰이는 조각 목록이다.

- id: q01_edge_average_speed
  question: "2026년 5월 30일 오후 12시에서 1시사이에 scope:edge:1742상의 택시들의 평균 속도는?"
  expected_concepts:
    - LOCATION/scope:COND
    - EVENT/passage:SUPPORT
    - AMOUNT/speed:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [PASSAGE_METRIC]

- id: q02_edge_passage_count
  question: "2026년 5월 30일 오후 12시에서 1시사이에 scope:edge:19384 지점을 통과하는 차량 대수는 몇대?"
  expected_concepts:
    - LOCATION/scope:COND
    - EVENT/passage:SUPPORT
    - AMOUNT/passage_count:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [PASSAGE_COUNT]

- id: q03_station_vicinity_speed
  question: "2026년 5월 30일 오후 12시에서 1시사이에 동대구역 근처 차량의 평균 운행 속도는?"
  expected_concepts:
    - LOCATION/place:SUBCOND
    - EVENT/passage:SUPPORT
    - AMOUNT/speed:MEASURE
  expected_macros: [PLACE_TO_SCOPE, EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, PASSAGE_METRIC]

