# expected_concepts / expected_macros / expected_operators는 geoflow 모드의
# 정확도 측정용 정답 라벨이다. react 모드와 query_loader는 이 key를 사용하지
# 않는다.
#
# expected_concepts는 "CONCEPT/subtype:ROLE" 형식이다. id는 모델이 정하는
# 이름이라 정답과 맞출 수 없으므로 의미만 적는다.
# expected_macros는 하나의 완성 template이 아니라 합성에 쓰이는 조각 목록이다.

- id: q01_edge_average_speed
  question: "2026년 5월 30일 오후 12시에서 1시사이에 scope:edge:1742상의 택시들의 평균 속도는?"
  expected_concepts:
    - LOCATION/scope:COND
    - EVENT/passage:SUPPORT
    - AMOUNT/speed:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [PASSAGE_METRIC]

- id: q12_vacant_drive_ratio
  question: "공차로 운행되는 택시 비율은?"
  expected_concepts:
    - EVENT/drive:SUPPORT
    - PROPORTION/vacant_ratio:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [DRIVE_METRIC]

- id: q16_1_private_revenue_by_day
  question: "개인용 택시의 요일별 택시 수입 분포는?"
  expected_concepts:
    - EVENT/operation:SUPPORT
    - AMOUNT/revenue:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

- id: q18_daegu_origin_destination_count
  question: "대구 동성로동에서 출발하여 신천동에 도착한 실차 구간 건수는?"
  expected_concepts:
    - LOCATION/place:SUBCOND
    - LOCATION/place:SUBCOND
    - EVENT/trip:SUPPORT
    - AMOUNT/trip_count:MEASURE
  expected_macros: [PLACE_TO_SCOPE, PLACE_TO_SCOPE, OD_EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, RESOLVE_PLACE_SCOPE, TRIP_COUNT]

- id: q20_daegu_average_fare
  question: "대구시의 평균 택시 요금은?"
  expected_concepts:
    - LOCATION/place:SUBCOND
    - EVENT/trip:SUPPORT
    - AMOUNT/fare:MEASURE
  expected_macros: [PLACE_TO_SCOPE, EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, TRIP_METRIC]
