    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 부산
        region: ''
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: operating_days
      role: MEASURE
      source: implicit
    factors:
      date: this_month
      taxi_type: private
      bucket: week
      rollup: min
- id: at/t03a
  group: T3
  contrast: 구간별 최댓값 중 가장 낮은 값(값)
  question: 지난달 법인택시 가동률의 주별 최댓값 중 가장 낮은 값은?
