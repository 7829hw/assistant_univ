  contrast: 그 값을 가진 주(구간)
  question: 지난달 법인택시 가동률의 주별 최댓값이 가장 낮았던 주는 어느 주야?
  expected_outcome: unsupported
  expected_error: UNVERIFIED_TIMS_CONTRACT
  why: 뜻은 명확하다(week, max, select=min). TIMS에서 실행할 수 없다
  gold_grounding:
    concepts:
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: PROPORTION
      subtype: active_taxi_ratio
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      taxi_type: corporate
      bucket: week
      aggregation: max
      select: min
