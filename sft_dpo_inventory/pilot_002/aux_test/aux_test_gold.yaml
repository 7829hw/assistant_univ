note: 'aux_test_v1(결정 42·46) 평가 전용 모음. 원본: evaluation/grounding_v12/final_questions.yaml, evaluation/grounding_v4/answer_target_questions.yaml. 목록 sha256 692b792fdfd1a95f9bd46c27262ed347d816076d15744070c1ca35ac25779aa0. 학습·checkpoint 선택·annotation에 쓰지 않음.'
items:
- id: at/t01a
  group: T1
  contrast: 구간별 합계의 최댓값(값)
  question: 지난해 대구 소속 택시의 월별 수입 합계 중 가장 큰 값은?
  gold_text: 'get_place_scope(name=대구)

    get_billing_metrics(metric=revenue, scope=$resolve.scope, date=last_year, bucket=month, aggregation=sum, rollup=max)'
- id: at/t01b
  group: T1
  contrast: 그 최댓값을 가진 달(구간)
  question: 지난해 대구 소속 택시의 월별 수입 합계가 가장 큰 달은?
  expected_outcome: unsupported
  expected_error: UNVERIFIED_TIMS_CONTRACT
  why: 뜻은 명확하다(bucket=month, inner=sum, select=max). TIMS bucket/rollup은 대표값만 돌려주고 로컬 재계산 근거가 계약에 없다
  gold_grounding:
    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 대구
        region: ''
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: last_year
      bucket: month
      aggregation: sum
      select: max
- id: at/t01c
  group: T1
  contrast: 구간 안 집계 없음(값)
  question: 지난해 대구 소속 택시의 월별 수입 중 가장 큰 값은?
  expected_outcome: needs_clarification
  expected_error: AMBIGUOUS_INNER_AGGREGATION
  why: 각 달 안에서 합할지 평균할지가 없다
  gold_grounding:
    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 대구
        region: ''
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: last_year
      bucket: month
      rollup: max
