- id: aux_test_v1:at/t02c
  group: T2
  contrast: 구간 안 집계 없음
  question: 이번 달 부산 소속 개인택시의 주별 운행 일수 중 가장 작은 값은?
  expected_outcome: needs_clarification
  expected_error: AMBIGUOUS_INNER_AGGREGATION
  why: 각 주 안에서 합할지 평균할지가 없다
  gold_grounding:
    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 부산
        region: ''
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: operating_days
      role: MEASURE
      source: implicit
    factors:
      date: this_month
      taxi_type: private
      bucket: week
      rollup: min
- id: sel154:indepv4/k39
  question: 올해 법인택시 수입을 한 달씩 묶어 볼 때, 그 월 값들 중 최고치는 얼마야?
  expected_outcome: needs_clarification
  why: 월 bucket과 rollup(max)은 있지만, 각 달 안에서 수입을 합할지 평균할지(구간 안 집계)가 질문에 없다. 기본값(avg)으로
    채우지 않는다
  gold_grounding:
    concepts:
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: this_year
      taxi_type: corporate
      bucket: month
      rollup: max
- id: sel154:indepv2/n27
