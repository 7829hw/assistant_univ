  expected_outcome: unsupported
  why: 수입은 일 단위 get_billing_metrics이고 time을 받지 않는다. 시간대 조건을 버리고 답하면 안 된다
  gold_grounding:
    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 대구
        region: ''
    - id: event
