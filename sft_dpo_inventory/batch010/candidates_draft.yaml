  question: 지난주 대구 신천동에 들어온 실차 건수를 출발 시군구별로 보여줘
  gold_text: 'get_place_scope(name=신천동, region=대구)

    get_trip_count(scope_dropoff=$dropoff.scope, date=last_week, dimension=sigungu,
    dimension_target=pickup)'
  rationale: '''…으로 들어온·…에 들어온'' = 그 장소가 하차(도착) 끝, ''…에서 나간·빠져나간'' = 승차(출발) 끝(od_role).
    묶는 끝은 dimension_target. 들어온 = 하차 끝, 출발 시군구별.'
