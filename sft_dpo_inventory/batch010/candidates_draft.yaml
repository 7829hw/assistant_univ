  gold_text: 'get_place_scope(name=두류동, region=대구)

    get_trip_count(scope_dropoff=$dropoff.scope, date=this_month, dimension=emd, dimension_target=pickup)'
  rationale: '''…으로 들어온·…에 들어온'' = 그 장소가 하차(도착) 끝, ''…에서 나간·빠져나간'' = 승차(출발) 끝(od_role).
    묶는 끝은 dimension_target. 들어온 = 하차 끝, 출발 읍면동별.'
