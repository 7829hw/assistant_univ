# - 결정 66: "실차 통행량" 대조 묶음. 의도 7개 × 네 대조(occupied, vacant, plain, trip) = 28건.
# - 근거: 학습 데이터에 passage_count + occupied 정답이 0개, valid98 h30의 오독(selection_decline/PASSAGE_STATUS.md).
