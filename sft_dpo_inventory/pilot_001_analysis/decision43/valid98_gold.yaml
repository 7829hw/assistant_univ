note: 'valid98(결정 29) 평가 전용 모음. 원본: evaluation/grounding_v7/stage_contrast_questions.yaml, evaluation/grounding_v8/heldout_questions.yaml, evaluation/grounding_v9/heldout_questions.yaml. 목록 sha256 512be78da0c1d3313a8d655502c7cbf73d44335962898297f76a945ce0080174. 학습 입력 아님.'
items:
- id: stage_v7/s01a
  group: S1
  contrast: 두 단계 모두 최댓값
  question: 지난달 대구 소속 택시의 주별 수입 최댓값 중 가장 큰 값은?
  gold_text: 'get_place_scope(name=대구)

    get_billing_metrics(metric=revenue, scope=$resolve.scope, date=last_month, bucket=week, aggregation=max, rollup=max)'
- id: stage_v7/s01b
