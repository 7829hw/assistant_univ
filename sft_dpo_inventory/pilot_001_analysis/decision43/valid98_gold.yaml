  expected_outcome: needs_clarification
  expected_error:
  - AMBIGUOUS_INNER_AGGREGATION
  - AMBIGUOUS_AGGREGATION_STAGE
  why: 각 주 안에서 합할지 평균할지가 없다
  gold_grounding:
    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 대구
        region: ''
    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      bucket: week
      rollup: max
