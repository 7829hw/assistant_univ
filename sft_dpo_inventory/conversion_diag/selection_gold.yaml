      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 동인동
        region: 대구
      attributes:
        od_role: pickup
    - id: event
      concept: EVENT
      subtype: trip
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: trip_count
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      taxi_type: private
