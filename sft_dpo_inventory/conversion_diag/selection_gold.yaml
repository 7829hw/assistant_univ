note: 'selection_v1(결정 41·46) 진단 전용 모음(결정 59). 원본: evaluation/grounding_v1/holdout_questions.yaml, evaluation/grounding_v2/contrast_questions.yaml, evaluation/grounding_v2/independent_questions.yaml, evaluation/grounding_v2/independent_v3_questions.yaml, evaluation/grounding_v3/independent_v4_questions.yaml. 목록 sha256 405af9c879ff2989374f6285195467793ee38a4b61fe867919e6eae8893cad25. 학습·checkpoint 선택·annotation에 쓰지 않음.'
items:
- id: old44/g02
  question: 2026년 7월 3일 오전 9시부터 11시까지 동성로의 실차 통행량은?
  gold_text: 'get_place_scope(name=동성로)

    get_passage_count(scope=$resolve.scope, date=20260703, time=090000-110000, taxi_status=occupied)'
- id: old44/g03
  question: 휴일 대구 달서구의 대기영업 법인택시 통행량은?
  gold_text: 'get_place_scope(name=달서구, region=대구)

    get_passage_count(scope=$resolve.scope, date=holiday, taxi_type=corporate, taxi_status=stationary)'
