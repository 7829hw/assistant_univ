  gold_text: 'get_place_scope(name=초량동, region=부산)

    get_trip_count(scope_dropoff=$dropoff.scope, date=weekend)'
- id: old44/g12
  question: 이번 달 대구에서 승차가 가장 많은 읍면동은?
  gold_text: 'get_place_scope(name=대구)

    get_trip_count(scope_pickup=$pickup.scope, date=this_month, dimension=emd, dimension_target=pickup, order=top, limit=1)'
- id: old44/g17
  question: 지난달 서울 소속 개인택시의 평균 요금은?
  expected_outcome: unsupported
  why: get_trip_metrics는 taxi_type을 받지 않는다. 택시 유형 조건을 버리고 답하면 안 된다(UNCONSUMED_CONDITION)
  gold_grounding:
    concepts:
    - id: place
      concept: LOCATION
      subtype: place
      role: SUBCOND
      source: user
      value:
        name: 서울
        region: ''
    - id: event
      concept: EVENT
      subtype: trip
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: fare
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      taxi_type: private
      aggregation: avg
- id: old44/g18
  question: 2026년 7월 5일 오후 6시부터 9시까지 부산 소속 택시의 요금 중간값은?
