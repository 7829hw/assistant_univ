    - id: event
      concept: EVENT
      subtype: operation
      role: SUPPORT
      source: implicit
    - id: measure
      concept: AMOUNT
      subtype: revenue
      role: MEASURE
      source: implicit
    factors:
      date: last_month
      taxi_type: private
      bucket: week
      rollup: avg
