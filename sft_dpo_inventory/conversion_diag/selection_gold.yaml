  question: 지난달 주별 개인택시 수입의 평균은?
  expected_outcome: needs_clarification
  why: 각 주 안에서 수입을 합할지 평균할지(구간 안 집계)가 질문에 없다. 기본값으로 채우지 않는다
  gold_grounding:
