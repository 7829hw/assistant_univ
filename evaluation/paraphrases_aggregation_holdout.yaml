    paraphrases:
      - {id: a03_p0, question: "매주 가장 높았던 하루 수입의 평균은?", note: "원문"}
      - {id: a03_p1, question: "주마다 하루 수입의 최대값을 구해 평균을 내면?", note: "절"}
      - {id: a03_p2, question: "하루 수입의 주별 최대값들을 평균하면 얼마인가요?", note: "측정값이 앞"}

  - intent: a04_week_min_then_avg_count
