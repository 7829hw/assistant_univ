    expected_tool_args: {metric: revenue}
    must_include: [["매달", "달마다"], ["합산", "더한"], ["가장 큰", "최대"], ["수입"]]
    golden:
      concepts:
        - {id: op, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: revenue, concept: AMOUNT, subtype: revenue, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: a02_p0, question: "매달 합산한 수입 중 가장 큰 값은?", note: "원문"}
      - {id: a02_p1, question: "수입을 달마다 합산했을 때 가장 큰 값은?", note: "측정값이 앞"}
      - {id: a02_p2, question: "매달 수입을 모두 더한 값의 최대값은?", note: "명사구"}

  - intent: a03_week_max_then_avg_revenue
