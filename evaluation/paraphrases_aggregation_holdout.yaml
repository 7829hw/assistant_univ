# 두 단계 집계 grounding(H0 vs H2) 검증용 fresh holdout corpus.
#
# H2 arm을 구현하거나 어떤 결과를 보기 전에 작성해 고정했다. 결과를 보고 문구를
# 고치지 않는다. 사람이 썼고, 어순·조사·수식어 위치만 바꿨다. prompt 예시 문장을
# 쓰지 않았다.
#
# 집계 의미는 intent마다 aggregation 하나에만 적는다(aggregation_plan.py).
#
#   aggregation: {final: avg}                                   구간 없음
#   aggregation: {bucket: month, inner: sum, final: avg}        두 단계
#   aggregation: {bucket: week, inner: unspecified, final: max} 구간 안 집계를 말하지 않음
#   aggregation: null                                           지원 범위 밖
#
# golden의 bucket·aggregation·rollup과 집계 관련 기대 Tool 인자는 여기서
# 유도한다. 손으로 적지 않는다. H2의 aggregation_plan도 같은 곳에서 유도한다.
#
# 구간 안 집계는 질문이 따로 말할 때만 inner로 적는다. 질문이 집계어를 하나만
# 말하면 그것은 최종 집계(final)다.

version: 1
parents: [evaluation/aggregation_holdout_parents.yaml]

intents:

  # --- A. 구간 안 집계와 최종 집계를 모두 말한다 -----------------------------

  - intent: a01_week_sum_then_avg_hours
    cohorts: [aggregation_stage]
    aggregation: {bucket: week, inner: sum, final: avg}
    expected_tool_args: {metric: hours}
    must_include: [["주별"], ["합"], ["평균"], ["영업 시간"]]
    golden:
      concepts:
        - {id: op, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: hours, concept: AMOUNT, subtype: hours, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: a01_p0, question: "주별로 합한 영업 시간의 평균은?", note: "원문"}
      - {id: a01_p1, question: "영업 시간을 주별로 합한 값들의 평균은?", note: "측정값이 앞"}
      - {id: a01_p2, question: "주별 영업 시간 합계를 평균 내면 얼마인가요?", note: "명사구"}

