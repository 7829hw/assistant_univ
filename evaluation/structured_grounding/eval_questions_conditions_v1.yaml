# 조건(날짜·장소·택시 유형) 보존 평가 셋 v1. 2026-09-26 작성, 측정 전 고정.
#
# 분리한 것
# - 기존 평가 셋(eval_questions_v1.yaml), 개발 질문, census corpus의 문장을 쓰지 않았다(중복 검사).
# - 조건 조합(택시 유형 × 기간 × 장소)은 새 intent다.
# 분리하지 못한 것(독립 평가가 아닌 이유)
# - 측정값 어휘(수입·영업 시간·영업 횟수·공차율·속도·요금·실차 건수), mock 지명, 문장 틀
#   ("지난달 X 개인택시의 평균 수입은?")은 기존 셋과 같은 계열이다.
# - 조건 규칙(geoflow/conditions.py)은 기존 30문항 관측을 보고 만들었다. 지원 표현
#   ("지난달", "개인택시" 등)도 그 관측에서 나왔다.
#
# 집계 난이도는 통제했다. 모든 질문이 한 단계 집계이거나 집계가 없다.
# 최소 대조쌍: 택시 유형(c01~c04), 기간(c08~c18), 출발/도착(c23·c24).
# 표현 변형: c05(=c01), c19(=c08).
#
# expected는 질문과 제품 계약(DEFAULT_CONTRACT, 기준일 2026-09-25 Asia/Seoul)으로 정했다.
# conditions.date는 pt_date 값. taxi_type "all"(전체 택시)은 조건이 없는 것과 같게 적는다.
# od는 {pickup, dropoff} 장소명.
version: 1
role: fresh_holdout
questions:
  - {id: c01, family: taxi, question: "지난달 서구 개인택시의 평균 수입은?",
     expected: {outcome: answered, plan: {final: avg}, conditions: {date: last_month, taxi_type: private, place: 서구}}}
  - {id: c02, family: taxi, question: "지난달 서구 법인택시의 평균 수입은?",
     expected: {outcome: answered, plan: {final: avg}, conditions: {date: last_month, taxi_type: corporate, place: 서구}}}
