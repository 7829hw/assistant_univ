# paraphrase corpus의 역할과 이력.
#
# 결과를 보고 결정을 내리는 데 한 번이라도 쓴 corpus는 더 이상 holdout이 아니다.
# 이름에 holdout이 들어 있어도 여기서 development로 표시한다. corpus 파일 자체는
# 고치지 않는다. 고치면 그 corpus로 잰 run의 meta에 남은 sha256과 어긋난다.
#
# role
#   development    후보를 고르거나 결정을 내리는 데 이미 쓴 것
#   fresh_holdout  아직 어떤 결과도 보지 않은 것. 한 번 쓰면 development로 바꾼다.
#
# sha256은 파일 본문이다. 테스트가 현재 파일과 대조해, 고정한 corpus가 바뀌면
# 걸린다.

