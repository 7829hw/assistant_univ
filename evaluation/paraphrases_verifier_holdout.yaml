# 의미 검증기(H0 vs V0) 검증용 fresh holdout corpus.
#
# V0 검증 prompt(cad71775)를 고정한 663959e 뒤, V0 holdout 결과를 보기 전에 작성했다.
# 사람이 썼다(qwen 사용 안 함). 어순·조사·수식어 위치만 바꿨다. 결과를 보고 문구를
# 고치지 않는다.
#
# family: 분석에서 탐지를 묶는 의미 family. control: 올바른 계획이 나오기 쉬운 대조군.
# 둘 다 검증기에는 보여 주지 않는다.

version: 1
parents: [evaluation/verifier_holdout_parents.yaml]

intents:

  # --- A. 집계 단계 ---

  - intent: v01_week_sum_then_max_hours
    cohorts: [factor_stage]
    family: A_aggregation
    control: false
    aggregation: {bucket: week, inner: sum, final: max}
    expected_tool_args: {metric: hours}
    must_include: [["주마다", "주별"], ["더한", "더했을", "합계"], ["가장 큰", "최댓값"], ["영업 시간"]]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: hours, concept: AMOUNT, subtype: hours, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v01_p0, question: "주마다 더한 영업 시간 가운데 가장 큰 값은?", note: "원문"}
      - {id: v01_p1, question: "영업 시간을 주마다 더했을 때 가장 큰 값은?", note: "어순"}
      - {id: v01_p2, question: "주별 영업 시간 합계의 최댓값은?", note: "절"}

  - intent: v02_month_min_then_avg_revenue
    cohorts: [factor_stage]
    family: A_aggregation
    control: false
    aggregation: {bucket: month, inner: min, final: avg}
    expected_tool_args: {metric: revenue}
    must_include: [["월별", "달마다", "매달"], ["가장 적었던", "최저"], ["평균"], ["수입"]]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: revenue, concept: AMOUNT, subtype: revenue, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v02_p0, question: "월별로 가장 적었던 하루 수입의 평균은?", note: "원문"}
      - {id: v02_p1, question: "달마다 하루 수입이 가장 적었던 값의 평균은?", note: "어순"}
      - {id: v02_p2, question: "매달 최저 하루 수입을 평균 내면?", note: "절"}

  - intent: v03_month_unspecified_med_hours
    cohorts: [factor_stage]
    family: A_aggregation
    control: false
    aggregation: {bucket: month, inner: unspecified, final: med}
    expected_tool_args: {metric: hours}
    must_include: [["월별", "월 단위"], ["중간값"], ["영업 시간"]]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: hours, concept: AMOUNT, subtype: hours, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v03_p0, question: "월별 영업 시간의 중간값은?", note: "원문"}
      - {id: v03_p1, question: "영업 시간을 월별로 보면 중간값은?", note: "어순"}
      - {id: v03_p2, question: "월 단위 택시 영업 시간 중간값은 얼마인가요?", note: "절"}

  - intent: v04_control_min_count
    cohorts: [factor_stage]
    family: A_aggregation
    control: true
    aggregation: {final: min}
    expected_tool_args: {metric: operating_count}
    must_include: [["최솟값", "가장 적은"], ["영업 횟수"]]
    must_exclude: ["주", "월", "달"]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: count, concept: AMOUNT, subtype: operating_count, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v04_p0, question: "택시 영업 횟수의 최솟값은?", note: "원문"}
      - {id: v04_p1, question: "영업 횟수 최솟값은 얼마인가요?", note: "어순"}
      - {id: v04_p2, question: "택시 영업 횟수 중 가장 적은 값은?", note: "절"}

  # --- B. 택시 유형 ---

  - intent: v05_private_avg_operating_ratio
    cohorts: [factor_stage]
    family: B_taxi_type
    control: false
    aggregation: {final: avg}
    expected_tool_args: {metric: operating_ratio, taxi_type: private}
    must_include: [["개인"], ["평균"], ["운행률"]]
    must_exclude: ["법인"]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: ratio, concept: PROPORTION, subtype: operating_ratio, role: MEASURE, source: implicit}
      factors: {taxi_type: private}
    paraphrases:
      - {id: v05_p0, question: "개인택시 운행률의 평균은?", note: "원문"}
      - {id: v05_p1, question: "운행률 평균을 개인택시만 보면?", note: "어순"}
      - {id: v05_p2, question: "개인택시는 평균 운행률이 얼마인가요?", note: "절"}

  - intent: v06_corporate_min_vacant_ratio
    cohorts: [factor_stage]
    family: B_taxi_type
    control: false
    aggregation: {final: min}
    expected_tool_args: {metric: vacant_ratio, taxi_type: corporate}
    must_include: [["법인"], ["최솟값", "가장 낮은"], ["공차율"]]
    must_exclude: ["개인"]
    golden:
      concepts:
        - {id: drive, concept: EVENT, subtype: drive, role: SUPPORT, source: implicit}
        - {id: ratio, concept: PROPORTION, subtype: vacant_ratio, role: MEASURE, source: implicit}
      factors: {taxi_type: corporate}
    paraphrases:
      - {id: v06_p0, question: "법인택시 공차율의 최솟값은?", note: "원문"}
      - {id: v06_p1, question: "공차율 최솟값을 법인택시 기준으로 알려줘", note: "어순"}
      - {id: v06_p2, question: "법인택시의 가장 낮은 공차율은?", note: "절"}

  - intent: v07_private_last_month_sum_hours
    cohorts: [factor_stage]
    family: B_taxi_type
    control: false
    aggregation: {final: sum}
    expected_tool_args: {metric: hours, taxi_type: private, date: last_month}
    must_include: [["개인"], ["지난달"], ["합계", "합하면"], ["영업"]]
    must_exclude: ["법인", "달마다", "월별"]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: hours, concept: AMOUNT, subtype: hours, role: MEASURE, source: implicit}
      factors: {taxi_type: private, date: last_month}
    paraphrases:
      - {id: v07_p0, question: "지난달 개인택시 영업 시간 합계는?", note: "원문"}
      - {id: v07_p1, question: "개인택시 영업 시간 합계를 지난달만 보면?", note: "어순"}
      - {id: v07_p2, question: "지난달에 개인택시가 영업한 시간을 모두 합하면?", note: "절"}

  - intent: v08_control_max_hours
    cohorts: [factor_stage]
    family: B_taxi_type
    control: true
    aggregation: {final: max}
    expected_tool_args: {metric: hours}
    must_include: [["최댓값", "가장 긴"], ["영업"]]
    must_exclude: ["개인", "법인"]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: hours, concept: AMOUNT, subtype: hours, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v08_p0, question: "택시 영업 시간의 최댓값은?", note: "원문"}
      - {id: v08_p1, question: "영업 시간 최댓값은 얼마인가요?", note: "어순"}
      - {id: v08_p2, question: "택시가 영업한 시간 중 가장 긴 값은?", note: "절"}

  # --- C. 날짜·시간 ---

  - intent: v09_last_week_suseong_avg_speed
    cohorts: [factor_stage]
    family: C_date_time
    control: false
    aggregation: {final: avg}
    expected_tool_args: {metric: speed, date: last_week}
    must_include: [["지난주"], ["수성구"], ["평균"], ["속도"]]
    must_exclude: ["주별", "주마다", "단위"]
    golden:
      concepts:
        - {id: suseong, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 수성구, region: ""}}
        - {id: passage, concept: EVENT, subtype: passage, role: SUPPORT, source: implicit}
        - {id: speed, concept: AMOUNT, subtype: speed, role: MEASURE, source: implicit}
      factors: {date: last_week}
    paraphrases:
      - {id: v09_p0, question: "지난주 수성구 평균 속도는?", note: "원문"}
      - {id: v09_p1, question: "수성구 평균 속도를 지난주 기준으로 알려줘", note: "어순"}
      - {id: v09_p2, question: "지난주에 수성구 택시 평균 속도는 얼마였나요?", note: "절"}

  - intent: v10_weekend_sum_count
    cohorts: [factor_stage]
    family: C_date_time
    control: false
    aggregation: {final: sum}
    expected_tool_args: {metric: operating_count, date: weekend}
    must_include: [["주말"], ["합계", "합하면"], ["영업 횟수"]]
    must_exclude: ["평일", "요일"]
    golden:
      concepts:
        - {id: operation, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: count, concept: AMOUNT, subtype: operating_count, role: MEASURE, source: implicit}
      factors: {date: weekend}
    paraphrases:
      - {id: v10_p0, question: "주말 영업 횟수의 합계는?", note: "원문"}
      - {id: v10_p1, question: "영업 횟수 합계를 주말만 놓고 보면?", note: "어순"}
      - {id: v10_p2, question: "주말에 택시 영업 횟수를 모두 합하면?", note: "절"}

  - intent: v11_evening_dongseongro_avg_speed
    cohorts: [factor_stage]
    family: C_date_time
    control: false
    aggregation: {final: avg}
    expected_tool_args: {metric: speed, time: 180000-200000}
    must_include: [["6시"], ["8시"], ["동성로"], ["평균"], ["속도"]]
    golden:
      concepts:
        - {id: street, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 동성로, region: ""}}
        - {id: passage, concept: EVENT, subtype: passage, role: SUPPORT, source: implicit}
        - {id: speed, concept: AMOUNT, subtype: speed, role: MEASURE, source: implicit}
      factors: {time: 180000-200000}
    paraphrases:
      - {id: v11_p0, question: "오후 6시부터 8시까지 동성로 평균 속도는?", note: "원문"}
      - {id: v11_p1, question: "동성로 평균 속도를 오후 6시에서 8시 사이로 보면?", note: "어순"}
      - {id: v11_p2, question: "저녁 6시~8시 동성로의 택시 평균 속도는?", note: "절"}

  - intent: v12_control_dongseongro_avg_speed
    cohorts: [factor_stage]
    family: C_date_time
    control: true
    aggregation: {final: avg}
    expected_tool_args: {metric: speed}
    must_include: [["동성로"], ["평균"], ["속도"]]
    must_exclude: ["지난", "주말", "평일", "오전", "오후"]
    golden:
      concepts:
        - {id: street, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 동성로, region: ""}}
        - {id: passage, concept: EVENT, subtype: passage, role: SUPPORT, source: implicit}
        - {id: speed, concept: AMOUNT, subtype: speed, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v12_p0, question: "동성로 택시 평균 속도는?", note: "원문"}
      - {id: v12_p1, question: "택시 평균 속도를 동성로에서 보면?", note: "어순"}
      - {id: v12_p2, question: "동성로의 평균 택시 속도는 얼마인가요?", note: "절"}

  # --- D. 승하차 관계 ---

  - intent: v13_duryu_to_sincheon_trip_count
    cohorts: [factor_stage]
    family: D_od_relation
    control: false
    aggregation: null
    expected_tool_args: {scope_pickup: "@place:두류동", scope_dropoff: "@place:신천동"}
    must_include: [["두류동"], ["신천동"], ["건수"]]
    od_roles: {두류동: pickup, 신천동: dropoff}
    golden:
      concepts:
        - {id: origin, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 두류동, region: ""}, attributes: {od_role: pickup}}
        - {id: destination, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 신천동, region: ""}, attributes: {od_role: dropoff}}
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: count, concept: AMOUNT, subtype: trip_count, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v13_p0, question: "두류동에서 출발해 신천동에 도착한 택시 실차 건수는?", note: "원문"}
      - {id: v13_p1, question: "신천동에 도착한 두류동 출발 실차 건수는?", note: "어순"}
      - {id: v13_p2, question: "출발지가 두류동이고 도착지가 신천동인 실차 건수는?", note: "절"}

  - intent: v14_choeup_to_gwangan_trip_count
    cohorts: [factor_stage]
    family: D_od_relation
    control: false
    aggregation: null
    expected_tool_args: {scope_pickup: "@place:초읍동", scope_dropoff: "@place:광안동"}
    must_include: [["초읍동"], ["광안동"], ["건수", "몇 건"]]
    od_roles: {초읍동: pickup, 광안동: dropoff}
    golden:
      concepts:
        - {id: origin, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 초읍동, region: ""}, attributes: {od_role: pickup}}
        - {id: destination, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 광안동, region: ""}, attributes: {od_role: dropoff}}
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: count, concept: AMOUNT, subtype: trip_count, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v14_p0, question: "광안동으로 간 초읍동 출발 실차 건수는?", note: "원문"}
      - {id: v14_p1, question: "초읍동을 출발지로, 광안동을 도착지로 한 실차 건수는?", note: "어순"}
      - {id: v14_p2, question: "초읍동에서 출발해 광안동으로 간 실차 구간은 몇 건인가요?", note: "절"}

  - intent: v15_dongin_to_taepyeong_trip_count
    cohorts: [factor_stage]
    family: D_od_relation
    control: false
    aggregation: null
    expected_tool_args: {scope_pickup: "@place:동인동", scope_dropoff: "@place:태평로동"}
    must_include: [["동인동"], ["태평로동"], ["건수"]]
    od_roles: {동인동: pickup, 태평로동: dropoff}
    golden:
      concepts:
        - {id: origin, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 동인동, region: ""}, attributes: {od_role: pickup}}
        - {id: destination, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 태평로동, region: ""}, attributes: {od_role: dropoff}}
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: count, concept: AMOUNT, subtype: trip_count, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v15_p0, question: "동인동 출발, 태평로동 도착 실차 건수는?", note: "원문"}
      - {id: v15_p1, question: "태평로동에 도착한 실차 가운데 동인동에서 출발한 건수는?", note: "어순"}
      - {id: v15_p2, question: "동인동에서 출발해 태평로동으로 간 실차 건수는?", note: "절"}

  - intent: v16_control_jungang_pickup_count
    cohorts: [factor_stage]
    family: D_od_relation
    control: true
    aggregation: null
    expected_tool_args: {scope_pickup: "@place:중앙로동", scope_dropoff: null}
    must_include: [["중앙로동"], ["출발"], ["건수", "몇 건"]]
    must_exclude: ["도착"]
    od_roles: {중앙로동: pickup}
    golden:
      concepts:
        - {id: origin, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 중앙로동, region: ""}, attributes: {od_role: pickup}}
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: count, concept: AMOUNT, subtype: trip_count, role: MEASURE, source: implicit}
      factors: {}
    paraphrases:
      - {id: v16_p0, question: "중앙로동에서 출발한 실차 건수는?", note: "원문"}
      - {id: v16_p1, question: "출발지가 중앙로동인 실차 건수는?", note: "어순"}
      - {id: v16_p2, question: "중앙로동 출발 실차는 몇 건인가요?", note: "절"}

  # --- E. 지원 범위 밖 질의를 값 하나로 뭉갬 ---

  - intent: v17_morning_afternoon_comparison
    cohorts: [factor_stage]
    family: E_unsupported_collapse
    control: false
    aggregation: null
    must_include: [["오전"], ["오후"], ["통행량"]]
    golden: {unsupported: true}
    paraphrases:
      - {id: v17_p0, question: "오전과 오후 중 동대구역 통행량이 더 많은 때는?", note: "원문"}
      - {id: v17_p1, question: "동대구역 통행량은 오전과 오후 중 언제 더 많나요?", note: "어순"}
      - {id: v17_p2, question: "오전과 오후를 비교하면 동대구역 통행량이 많은 쪽은?", note: "절"}

  - intent: v18_speed_by_hour_list
    cohorts: [factor_stage]
    family: E_unsupported_collapse
    control: false
    aggregation: null
    must_include: [["시간"], ["동대구역"], ["속도"]]
    golden: {unsupported: true}
    paraphrases:
      - {id: v18_p0, question: "시간대마다 동대구역 평균 속도를 나눠 보여줘", note: "원문"}
      - {id: v18_p1, question: "동대구역 평균 속도를 시간대별로 각각 알려줘", note: "어순"}
      - {id: v18_p2, question: "한 시간 단위로 동대구역 평균 속도를 모두 보여줘", note: "절"}

  - intent: v19_two_district_comparison
    cohorts: [factor_stage]
    family: E_unsupported_collapse
    control: false
    aggregation: null
    must_include: [["수성구"], ["달서구"], ["영업 횟수"]]
