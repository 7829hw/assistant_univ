# evaluation/vendor100/stated_variants.yaml
#
# 사용자가 제공자 기본 의미와 다를 수 있는 구간 정의를 **명시한** 변형 질문. 업체 100문항이 아니며
# 업체 정답도 없다. 기대 결과는 GeoFlow 정책에서 온다(evaluation/design/provider_delegation.md):
# 명시한 정의를 Tool이 표현하거나 계약이 보장하지 못하면 제공자 기본값으로 조용히 바꾸지 않는다.
#
# grounding은 base 문항의 업체 정답에서 역산한 것을 그대로 쓴다(evaluate_vendor100.py gold).
# 즉 LLM이 집계를 맞게 읽었다고 가정하고, 명시 조건은 질문 원문에서 결정적으로 읽힌다.

variants:
  - id: v043_sunday_week
    base: "043"
    question: "이번 달 법인택시의 일요일부터 시작하는 주별 평균 가동률 중 가장 낮은 값은?"
    expected_outcome: unsupported
    expected_error: CALENDAR_REQUIREMENT_UNSUPPORTED
    why: "bucket_week_start UNKNOWN. 위임하면 제공자 주 정의가 쓰인다. 로컬 재계산은 avg·가동률이라 불가"
  - id: v043_monday_week
    base: "043"
    question: "이번 달 법인택시의 월요일 시작 주별 평균 가동률 중 가장 낮은 값은?"
    expected_outcome: unsupported
    expected_error: CALENDAR_REQUIREMENT_UNSUPPORTED
    why: "월요일은 로컬 정책의 기본값이지만 제공자 정의라는 근거가 아니다"
  - id: v043_complete_weeks
    base: "043"
    question: "이번 달 법인택시의 온전한 주만 놓고 주별 평균 가동률 중 가장 낮은 값은?"
    expected_outcome: unsupported
    expected_error: CALENDAR_REQUIREMENT_UNSUPPORTED
    why: "bucket_partial UNKNOWN"
  - id: v098_empty_zero
    base: "098"
    question: "지난달 대구 소속 개인택시의 주별 평균 운행 일수의 중간값은? 운행이 없는 주는 0으로 넣어줘."
    expected_outcome: unsupported
    expected_error: CALENDAR_REQUIREMENT_UNSUPPORTED
    why: "bucket_empty UNKNOWN. 로컬 재계산도 빈 구간 처리를 구현하지 않음"
  - id: v014_sunday_last_week
    base: "014"
    question: "일요일부터 시작하는 주 기준으로 지난 주 개인택시의 평균 가동률은?"
    expected_outcome: unsupported
    expected_error: CALENDAR_REQUIREMENT_UNSUPPORTED
    why: "last_week 토큰의 주 정의는 제공자 정의(relative_date_reference UNKNOWN). 명시 범위는 range_inclusive 미확인"
  - id: v063_unreadable_week_definition
    base: "063"
    question: "주 시작은 어떻게 잡든 지난 주 개인택시의 평균 운행 일수는?"
    expected_outcome: needs_clarification
    expected_error: AMBIGUOUS_CALENDAR_REQUIREMENT
    why: "구간 정의 단서가 있으나 닫힌 어휘로 읽지 못함. 추측하지 않고 확인 요청"
  - id: v057_partial_without_grouping
    base: "057"
    question: "지난달 부산 소속 택시의 평균 수입은? 부분 주는 제외하고."
    expected_outcome: unsupported
    expected_error: UNCONSUMED_CONDITION
    why: "구간이 없는 질문에 붙은 구간 정의. 조용히 버리지 않음"
