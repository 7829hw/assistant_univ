items:
- id: '001'
  question: 주말 오후 6시부터 8시까지 광안리 주변의 공차 법인택시 통행량은?
  vendor_verdict: Tool 정상 / 최종답변 오류
  vendor_note: Tool 호출은 정확하지만 최종 답변이 Tool 결과 12,345건을 18,345건으로 바꿈.
  vendor_result: 'get_place_scope(name=광안리, include_vicinity=true)

    get_passage_count(scope=scope:gz:33212, date=weekend, time=180000-200000, taxi_type=corporate, taxi_status=vacant)'
  gold_text: 'get_place_scope(name=광안리, include_vicinity=true)

    get_passage_count(scope=$resolve.scope, date=weekend, time=180000-200000, taxi_type=corporate, taxi_status=vacant)'
  gold:
  - tool: get_place_scope
    args:
      name: 광안리
      include_vicinity: true
  - tool: get_passage_count
    args:
      scope: $resolve.scope
      date: weekend
      time: 180000-200000
      taxi_type: corporate
      taxi_status: vacant
- id: '002'
  question: 이번 주 부산의 시군구별 택시 통행량을 적은 순서로 2곳 알려줘.
  vendor_verdict: Tool은 맞음 / 인자 오류
  vendor_note: 이번 주 조건(date=this_week)을 누락함.
  vendor_result: 'get_place_scope(name=부산, region=)

    get_passage_count(scope=scope:district:2600000000, dimension=sigungu, order=bottom, limit=2)'
  gold_text: 'get_place_scope(name=부산)

    get_passage_count(scope=$resolve.scope, date=this_week, dimension=sigungu, order=bottom, limit=2)'
  gold:
  - tool: get_place_scope
    args:
      name: 부산
  - tool: get_passage_count
    args:
      scope: $resolve.scope
      date: this_week
      dimension: sigungu
      order: bottom
      limit: 2
