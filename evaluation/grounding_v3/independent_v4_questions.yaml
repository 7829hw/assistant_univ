  - id: k15
    question: "이번 달 서울 소속 법인택시 하루 수입 평균 좀 알려 줄래?"
    gold_text: |-
      get_place_scope(name=서울)
      get_billing_metrics(metric=revenue, scope=$resolve.scope, date=this_month, taxi_type=corporate, aggregation=avg)
  - id: k16
