    gold_text: |-
      get_place_scope(name=인천)
      get_billing_metrics(metric=operating_days, scope=$resolve.scope, date=this_year, taxi_type=private, aggregation=avg)
  - id: k19
    question: "지난달 법인택시 하루 평균 수입을 요일끼리 비교하면 어느 요일이 제일 높아?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_month, taxi_type=corporate, aggregation=avg, dimension=dayofweek, order=top, limit=1)
  - id: k20
    question: "scope:edge:11234 가 가리키는 곳 이름 좀 알려 줘."
    gold_text: |-
      get_scope_name(scope=scope:edge:11234)
  - id: k21
    question: "집계표에 scope:district:2723010100 이라고 나와 있는데 이게 어느 동이야?"
    gold_text: |-
      get_scope_name(scope=scope:district:2723010100)
  - id: k22
    question: "이번 주 대구 달서구를 H3 셀로 나눴을 때 손님 태운 택시 통행이 가장 적은 셀 하나는?"
    gold_text: |-
      get_place_scope(name=달서구, region=대구)
      get_passage_count(scope=$resolve.scope, date=this_week, taxi_status=occupied, dimension=h3, order=bottom, limit=1)
  - id: k23
    question: "부산 소속 법인택시들이 이번 달 받은 운임을 줄 세우면 한가운데 값이 얼마야?"
    expected_outcome: unsupported
    why: "운임은 get_trip_metrics인데 taxi_type을 받지 않는다. 법인택시 조건을 버리고 답하면 안 된다"
    gold_grounding:
      concepts:
        - {id: place, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 부산, region: ""}}
        - {id: event, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: measure, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: this_month, taxi_type: corporate, aggregation: med}
  - id: k24
    question: "대구 동인동에서 출발한 실차 건수를 월요일부터 일요일까지 요일별로 나눠 줘."
    expected_outcome: unsupported
    why: "요일(dayofweek) 분류는 get_trip_count의 dimension enum(h3, sido, sigungu, emd)에 없다. 요일 분류를 버리고 총량만 답하면 안 된다"

  # ── 승하차 끝(scope) vs 결과를 묶는 끝(dimension_target) ──
  - id: k25
    question: "올해 부산 초량동에 내려준 운행들을 태운 동 기준으로 보면, 제일 많은 두 곳은 어디야?"
    gold_text: |-
      get_place_scope(name=초량동, region=부산)
      get_trip_count(scope_dropoff=$dropoff.scope, date=this_year, dimension=emd, dimension_target=pickup, order=top, limit=2)
  - id: k26
    question: "지난달 동성로에서 손님을 태운 택시들이 어느 시군구에 가장 적게 내려 줬어?"
    gold_text: |-
      get_place_scope(name=동성로)
      get_trip_count(scope_pickup=$pickup.scope, date=last_month, dimension=sigungu, dimension_target=dropoff, order=bottom, limit=1)
  - id: k27
    question: "평일 아침 7시~9시에 대구 수성구에서 승차가 가장 활발한 동 세 곳을 알려 줘."
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, date=weekday, time=070000-090000, dimension=emd, dimension_target=pickup, order=top, limit=3)
  - id: k28
    question: "이번 달 대구 중구로 향한 손님들이 실제로 내린 위치를 H3 셀 기준으로 보면 가장 붐빈 두 셀은?"
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=this_month, dimension=h3, dimension_target=dropoff, order=top, limit=2)

  # ── 출발지→도착지 쌍(양방향 어순), 한 지역 내부 OD ──
  - id: k29
    question: "부산 광안동에서 내린 손님 중 출발이 대구 신천동이었던 운행, 지난달엔 몇 건이야?"
    gold_text: |-
      get_place_scope(name=신천동, region=대구)
      get_place_scope(name=광안동, region=부산)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_month)
  - id: k30
    question: "휴일 낮 1시~6시 사이 대구 두류동 → 대구 동인동 이동 실차는 몇 건?"
    gold_text: |-
      get_place_scope(name=두류동, region=대구)
      get_place_scope(name=동인동, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=holiday, time=130000-180000)
  - id: k31
    question: "지난주 대구로 들어온 운행 중 부산에서 출발한 것들을 부산 시군구별로 나누면 가장 많이 출발한 구는?"
    gold_text: |-
      get_place_scope(name=부산)
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_week, dimension=sigungu, dimension_target=pickup, order=top, limit=1)
  - id: k32
    question: "지난달 부산 수영구 안에서 타고 내린 실차 건수는 얼마나 돼?"
    gold_text: |-
      get_place_scope(name=수영구, region=부산)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=last_month)
  - id: k33
    question: "이번 달 대구 중구 안에서만 움직인 운행을 동에서 동으로 가는 경로로 묶으면 가장 많이 다닌 두 경로는?"
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=this_month, dimension=emd, dimension_target=both, order=top, limit=2)
  - id: k34
    question: "평일에 대구 안에서 출발과 도착이 다 이뤄진 운행을 내린 구 기준으로 세면 가장 적은 구는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=weekday, dimension=sigungu, dimension_target=dropoff, order=bottom, limit=1)

  # ── 순위 방향(order) vs 집계 연산(aggregation) ──
  - id: k35
    question: "지난달 시도마다 법인택시 가동률의 최고치를 뽑았을 때, 그 최고치가 가장 낮은 두 시도는?"
    gold_text: |-
      get_billing_metrics(metric=active_taxi_ratio, date=last_month, taxi_type=corporate, aggregation=max, dimension=sido, order=bottom, limit=2)
  - id: k36
    question: "올해 요일별로 택시 하루 수입의 최솟값을 구하면, 그 최솟값이 가장 높은 요일은 언제야?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=this_year, aggregation=min, dimension=dayofweek, order=top, limit=1)

  # ── 주·월 2단계 집계(bucket + 구간 안 집계 + rollup) ──
  - id: k37
    question: "올해 서울 소속 법인택시 가동률을 주마다 평균 낸 뒤 그중 제일 낮은 주의 값을 알려 줘."
    gold_text: |-
      get_place_scope(name=서울)
      get_billing_metrics(metric=active_taxi_ratio, scope=$resolve.scope, date=this_year, taxi_type=corporate, aggregation=avg, bucket=week, rollup=min)
  - id: k38
    question: "작년 대구 소속 택시 수입을 월 단위로 합산해서 나온 열두 개 값의 평균을 구해 줘."
    gold_text: |-
      get_place_scope(name=대구)
      get_billing_metrics(metric=revenue, scope=$resolve.scope, date=last_year, aggregation=sum, bucket=month, rollup=avg)
  - id: k39
    question: "올해 법인택시 수입을 한 달씩 묶어 볼 때, 그 월 값들 중 최고치는 얼마야?"
    expected_outcome: needs_clarification
    why: "월 bucket과 rollup(max)은 있지만, 각 달 안에서 수입을 합할지 평균할지(구간 안 집계)가 질문에 없다. 기본값(avg)으로 채우지 않는다"
    gold_grounding:
      concepts:
        - {id: event, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: measure, concept: AMOUNT, subtype: revenue, role: MEASURE, source: implicit}
      factors: {date: this_year, taxi_type: corporate, bucket: month, rollup: max}
  - id: k40
    question: "올해 대구 소속 택시의 월평균 운행 일수가 가장 낮았던 달은 몇 월이야?"
    expected_outcome: unsupported
    why: "값이 아니라 구간(어느 달)을 묻는다. get_billing_metrics의 bucket/rollup은 스칼라 대표값만 반환하고 달 라벨을 돌려주지 않는다"
