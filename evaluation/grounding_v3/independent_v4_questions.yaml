      get_trip_metrics(metric=fare, scope=$resolve.scope, date=this_month, time=000000-050000, aggregation=max)
  - id: k13
    question: "지난달 대구 달서구 소속 법인택시의 공차율은 평균적으로 어떻게 나와?"
    gold_text: |-
