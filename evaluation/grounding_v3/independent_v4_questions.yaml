# independent_v4 questions.yaml
#
# 질문 해석 코드와 독립으로 만든 새 평가셋(초안).
#
# - 작성: Claude subagent(질문 작성자). 해석 코드(geoflow/), tests/, prompts/geoflow_planner.yaml,
#   이전 분석·실행 결과(grounding_v1/v2/v3의 질문 파일 외 모든 것), git 이력을 보지 않고 작성했다.
#   참고한 것은 schemas/*.yaml, prompts/system.yaml, mock_stub.yaml의 gazetteer,
#   evaluation/vendor100/gold.yaml(표기 규칙), grounding_v1/holdout_questions.yaml,
#   grounding_v2/independent_questions.yaml, grounding_v2/contrast_questions.yaml,
#   grounding_v2/independent_v3_questions.yaml(형식, 유사 문장 회피)뿐이다.
# - 사람 검토 없음(not human-reviewed). 업체 정답이 아니다.
# - 상대 날짜 기준일: 2026-09-25 (Asia/Seoul). 연도 없이 적은 날짜는 2026년이다.
# - 기존 다섯 파일(업체 100문항, grounding_v1 holdout, grounding_v2 독립셋·대조셋·독립 v3)의 모든 문장과
#   difflib 문자 유사도 0.7 이하가 되도록 새로 썼다. 장소는 mock gazetteer에 있는 이름만 쓴다.
# - gold 표기는 evaluation/vendor100/gold.yaml과 같다: `tool(k=v, ...)` 줄, 장소 결과는
#   $resolve/$pickup/$dropoff/$area.scope. taxi_type=all, taxi_status=all,
#   include_vicinity=false 같은 기본값은 적지 않는다. metric tool의 aggregation(avg 포함)과
#   dimension 지정 시 dimension_target(both 포함)은 적는다. 단일 최상·최하는 limit=1.
# - 두 장소 질문의 get_place_scope 순서는 승차지 먼저, 하차지 나중이다(문장 순서와 무관).
#   $pickup/$dropoff가 조회 순서로 묶이기 때문이다.
# - expected_outcome이 answered가 아니면 gold 호출이 없고, 결과 종류만 채점한다.
#
# 구성: k01-k24 일반 사용(모든 tool, 통상 조건)과 조건 미지원 2문항,
#       k25-k40 의미 구분(승하차 끝 vs 집계 대상 끝, OD 방향·한 지역 내부 OD,
#       순위 방향 vs 집계 연산, 주·월 2단계 집계).
#
# 라벨 점검과 수정(evaluate_vendor100.py gold, LLM 미사용. 저장소 밖 파일이라 gold_file 메타 경로만 바꾸는
# 래퍼로 실행했다):
# - 첫 실행에서 answered 36문항 모두 match, 비응답 4문항은 expected_refusal 2·no_gold_grounding 2였다.
#   라벨·문장 수정 없음.

version: independent_v4
status: preregistered
items:
  # ── 일반 사용 ──
  - id: k01
    question: "9월 14일부터 18일까지 대구 두류동 도로에서 손님을 태운 채 달린 택시 통행이 얼마나 잡혔어?"
    gold_text: |-
      get_place_scope(name=두류동, region=대구)
      get_passage_count(scope=$resolve.scope, date=20260914-20260918, taxi_status=occupied)
  - id: k02
    question: "주말 기준으로 부산 안에서 법인택시 통행이 많은 시군구를 세 군데만 꼽아 줘."
    gold_text: |-
      get_place_scope(name=부산)
      get_passage_count(scope=$resolve.scope, date=weekend, taxi_type=corporate, dimension=sigungu, order=top, limit=3)
  - id: k03
    question: "지난주 새벽 1시에서 4시 사이 동성로 인근을 빈 차로 지나간 택시 통행량 좀 알려 줘."
    gold_text: |-
      get_place_scope(name=동성로, include_vicinity=true)
      get_passage_count(scope=$resolve.scope, date=last_week, time=010000-040000, taxi_status=vacant)
  - id: k04
    question: "scope:h3:8830e1d85ffffff 셀을 9월 25일 하루 동안 지나간 개인택시 통행량은 몇 건이야?"
    gold_text: |-
      get_passage_count(scope=scope:h3:8830e1d85ffffff, date=20260925, taxi_type=private)
  - id: k05
    question: "부산 어린이대공원 구간 도로에서 평일에 잰 택시 속도의 중앙값을 알려 줘."
    gold_text: |-
      get_place_scope(name=어린이대공원, region=부산)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=weekday, aggregation=med)
  - id: k06
    question: "지난달 대구 신천동 도로 위 택시들의 평균 엔진 회전수(RPM)는 어느 정도였어?"
    gold_text: |-
      get_place_scope(name=신천동, region=대구)
      get_passage_metrics(metric=rpm, scope=$resolve.scope, date=last_month, aggregation=avg)
  - id: k07
    question: "이번 주 출근 시간대인 아침 7시~9시에 동대구역 부근 평균 주행 속도가 궁금해."
    gold_text: |-
      get_place_scope(name=동대구역, include_vicinity=true)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=this_week, time=070000-090000, aggregation=avg)
  - id: k08
    question: "지난주 동대구역에서 택시에 올라탄 손님 건수는?"
    gold_text: |-
      get_place_scope(name=동대구역)
      get_trip_count(scope_pickup=$pickup.scope, date=last_week)
  - id: k09
    question: "지난달 전국에서 하차가 제일 많이 일어난 시군구 두 곳만 뽑아 줘."
    gold_text: |-
      get_trip_count(date=last_month, dimension=sigungu, dimension_target=dropoff, order=top, limit=2)
  - id: k10
    question: "하차 지점이 scope:district:2617010100인 실차가 이번 주에 몇 건 있었는지 세어 줘."
    gold_text: |-
      get_trip_count(scope_dropoff=scope:district:2617010100, date=this_week)
  - id: k11
    question: "지난주 부산 수영구 소속 택시가 손님을 한 번 태울 때 받은 요금은 평균 얼마였어?"
    gold_text: |-
      get_place_scope(name=수영구, region=부산)
