# schemas/_common.yaml
# 3개 이상의 tool에서 반복 사용되는 파라미터 타입만 정의한다.
# 1~2개 tool에서만 쓰이거나 tool마다 허용 집합이 다른 파라미터
# (dimension, bucket, rollup, taxi_status, metric 등)는 각 tool에 직접 정의한다.
#
# description 작성 원칙:
#   - 모든 tool에 그대로 복제되므로 한 줄로 유지한다.
#   - enum 값 자체가 의미를 드러내면 값 설명을 생략한다.
#   - 상세 정의는 시스템 프롬프트 [도구 파라미터 형식]에 한 번만 둔다.
#     description 끝의 (pt_*)는 그 정의를 찾아가는 키 역할을 한다.
#
# 인라인 전개 시 sibling 속성 보존 필요:
#   jsonref.replace_refs(obj, lazy_load=False, merge_props=True)

$defs:

  pt_scope:
    type: string
    pattern: '^scope:[A-Za-z0-9_:.-]+$'
    description: "공간 범위(pt_scope). scope:로 시작하는 문자열. 직접 생성 금지."
    examples: ["scope:district:2729000000"]

  pt_date:
    type: string
    pattern: '^(\d{8}(-\d{8})?|last_week|last_month|last_year|weekday|weekend|holiday)$'
    description: >-
      날짜 또는 날짜 범위(pt_date). YYYYMMDD 또는 YYYYMMDD-YYYYMMDD.
      last_week, last_month, last_year, weekday, weekend, holiday 사용 가능.
    examples: ["20260601-20260605", "last_month"]

  pt_time:
    type: string
    pattern: '^\d{6}-\d{6}$'
    description: "시간 범위(pt_time). HHMMSS-HHMMSS. 생략 시 시간대 무관."
    examples: ["120030-142530"]

  pt_aggregation:
    type: string
    enum: [max, min, sum, avg, med]
    default: avg
    description: "집계 방식(pt_aggregation). med=중간값."

  pt_taxi_type:
    type: string
    enum: [private, corporate, all]
    default: all
    description: "택시 유형(pt_taxi_type). private=개인, corporate=법인, all=조건 미적용."

  pt_order:
    type: string
    enum: [top, bottom]
    description: "정렬 순서(pt_order). top=상위부터, bottom=하위부터. dimension 지정 시에만 유효."

  pt_limit:
    type: integer
    minimum: 1
    description: "반환 개수(pt_limit). order 정렬 후 앞에서부터. dimension 지정 시에만 유효."
