# schemas/gazetteer.yaml
# 장소명 ↔ scope 상호 변환 tool 군.

- type: function
  function:
    name: get_place_scope
    description: |
      장소명에 대응하는 scope를 반환한다.
      반환값은 pt_scope 형식이며 다른 tool의 입력으로 그대로 사용할 수 있다.
      동일 명칭의 장소가 여럿인 경우 후보 목록을 반환한다.
    parameters:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: >-
            장소의 핵심 명칭. 조사(의, 에, 에서, 부근의 등)를 제거한 명칭만 전달한다.
            상위 지역명은 여기에 포함하지 않고 region으로 분리한다.
          examples: ["어린이대공원", "강남역"]
        region:
          type: string
          description: >-
            상위 지역명. 동일 명칭의 장소를 구분하는 단서이므로 발화에 있으면 반드시 전달한다.
            발화에 없으면 빈 문자열로 두고 임의로 추정하지 않는다.
          examples: ["서울 능동"]
        include_vicinity:
          type: boolean
          default: false
          description: "주변 영역 포함 여부."

- type: function
  function:
    name: get_scope_name
    description: |
      scope에 대응하는 장소명을 반환한다.
      집계 결과에 포함된 scope를 사용자에게 제시할 때 사용한다.
    parameters:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          $ref: "#/$defs/pt_scope"
          description: >-
            장소 명칭을 얻고자 하는 공간 범위(pt_scope).
            scope:로 시작하는 문자열. 직접 생성 금지.
