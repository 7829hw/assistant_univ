    gold_text: |-
      get_place_scope(name=부산)
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_week, dimension=emd, dimension_target=dropoff, order=top, limit=2)
  - id: s04
