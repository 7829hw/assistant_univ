# evaluation/grounding_v10/status_contrast_questions.yaml
#
# 실차 구간(trip)이라는 분석 대상, 통행량에 붙는 운행 상태 조건(실차·공차·대기영업), trip으로 충족할 수 없는 상태·조건을
# 가르는 대조 셋.
#
# - 작성: Claude(주 에이전트, 계약 설명 후보를 쓰는 쪽). 사람 검토 없음. 개발용 대조 셋이다.
# - 기준일 2026-09-25(금). 장소는 mock gazetteer 이름.
# - 기대 결과는 실행 계약(schemas/tims.yaml)과 질문 의미로 정했다. 후보 실행 전에 정답 실행기로 확인해 고정한다.
#   - taxi_status를 받는 Tool은 get_passage_count뿐이다. get_trip_count는 taxi_status·taxi_type을 받지 않는다.
#   - 실차 구간(trip)은 승객을 태운 운행 구간 자체다. "실차"가 그 대상을 가리키면 별도 조건이 아니다.
#   - 질문이 trip으로 충족할 수 없는 상태(공차·대기영업)나 trip이 받지 않는 조건(택시 유형)을 요구하면 그 조건을 버리고
#     답하면 안 된다. 지원 불가로 멈춰야 한다(expected_outcome: unsupported). 이런 문항은 gold_grounding으로 "조건을 보존한
#     grounding이 그 이유로 멈춤"을 확인한다.
# - category: A trip 대상 / B 통행량 상태 조건 / C 지원 불가 결합 / D 비슷한 단어·다른 측정값 / E 상태 표현 없는 회귀 /
#   F 조건 계층이 질문 표현으로 상태 값을 채우는 경로(계약 설명으로 바뀌지 않는다. 따로 보고)

version: grounding_v10_status_contrast
status: development
items:
  # ── A. 실차 구간이 분석 대상 ─────────────────────────────────────────────
  - id: s01
    category: A
    question: "지난달 대구 수성구에서 출발한 실차 건수는?"
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, date=last_month)
  - id: s02
