    category: A
    question: "평일 오전 7시부터 9시까지 부산 초량동에 내린 실차를 승차 시군구별로 셌을 때 가장 적은 곳은?"
    gold_text: |-
      get_place_scope(name=초량동, region=부산)
      get_trip_count(scope_dropoff=$dropoff.scope, date=weekday, time=070000-090000, dimension=sigungu, dimension_target=pickup, order=bottom, limit=1)
  - id: s06
    category: A
