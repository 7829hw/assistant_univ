# evaluation/grounding_v10/heldout_questions.yaml
#
# grounding_v10 held-out 문항. 새 grounding 모델·계약 설명이 현재 기본값을 대체할지 한 번 판정하는 데 쓴다.
# 정답 호출은 업체 schema 표기다($pickup/$dropoff/$area/$resolve.scope는 앞선 get_place_scope 결과).

version: grounding_v10_heldout
status: heldout
note: >-
  기준일 2026-09-25(금). 어제=20260924, 지난주 금요일=20260918, 상대 날짜는 schema 토큰(last_week, last_month,
  this_week, this_month, this_year, weekday, weekend)을 쓴다. 시각은 HHMMSS-HHMMSS(정시 끝은 해당 정시).
  작성: Claude 하위 에이전트(구현과 독립). schemas/, mock_stub.yaml gazetteer, mock_responses.py의 장소 조회·dimension 후보
  부분, 형식 예시 한 파일(grounding_v8/od_contrast_questions.yaml), evaluate_vendor100.py의 parse_calls·load_gold·
  _binding_place·score만 읽었다. geoflow/, prompts/, tests/, 다른 평가 문항·분석·run은 읽지 않았고 모델을 부르지 않았다.
  사람 검토 없음. 장소는 mock gazetteer에서 풀리는 이름만 쓴다. region은 질문이 상위 지역을 말할 때만 넣는다.
  답하지 않아야 하는 문항은 gold_text가 비어 있고 expected_outcome을 둔다. unsupported 문항의 required_condition은
  해당 측정 Tool이 받지 못해 떨어뜨리면 안 되는 조건이다.
  실행기 확인(evaluate_vendor100.py gold) 후 수정: 없음.
items:
  # 1. status_trip: 실차 표현 + trip 자체가 분석 대상. trip은 정의상 실차이므로 taxi_status 없음.
  - id: v01
    group: status_trip
    question: "지난주 동대구역에서 출발한 실차 구간은 모두 몇 건이었나요?"
    gold_text: |-
      get_place_scope(name=동대구역)
      get_trip_count(scope_pickup=$pickup.scope, date=last_week)
  - id: v02
    group: status_trip
    question: "어제 광안리에 도착한 손님 태운 운행 건수 좀 알려줘"
    gold_text: |-
      get_place_scope(name=광안리)
      get_trip_count(scope_dropoff=$dropoff.scope, date=20260924)
  - id: v03
    group: status_trip
    question: "이번 달 부산 수영구 안에서 승객을 실은 택시가 출발도 하고 도착도 한 건수는 얼마나 돼?"
    gold_text: |-
      get_place_scope(name=수영구, region=부산)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=this_month)
  - id: v04
    group: status_trip
    question: "지난달 대구 동구에서 출발해 대구 수성구로 들어간 실차는 몇 건입니까?"
    gold_text: |-
      get_place_scope(name=동구, region=대구)
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_month)
  - id: v05
    group: status_trip
    question: "지난달 동성로에서 승객을 태운 실차 구간이 가장 많이 끝난 읍면동 세 곳을 뽑아줘"
    gold_text: |-
      get_place_scope(name=동성로)
      get_trip_count(scope_pickup=$pickup.scope, date=last_month, dimension=emd, dimension_target=dropoff, order=top, limit=3)
  - id: v06
    group: status_trip
    question: "지난주 금요일 부산진구에 도착한 실차 구간을 승객이 탄 시군구별로 묶었을 때 가장 많은 곳은 어디인가요?"
    gold_text: |-
      get_place_scope(name=부산진구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=20260918, dimension=sigungu, dimension_target=pickup, order=top, limit=1)
  - id: v07
    group: status_trip
    question: "어제 저녁 6시부터 8시까지 대구 안에서만 오간 실차를 출발 동과 도착 동 쌍으로 묶어서 많은 순으로 5개 보여줘"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=20260924, time=180000-200000, dimension=emd, dimension_target=both, order=top, limit=5)

