  - id: h43
    group: general
    question: "올해 서울 개인택시 수익금을 월별로 합산했을 때 가장 큰 달의 합계는 얼마인가요?"
    gold_text: |-
      get_place_scope(name=서울)
      get_billing_metrics(metric=revenue, scope=$resolve.scope, date=this_year, taxi_type=private, aggregation=sum, bucket=month, rollup=max)
  - id: h44
    group: general
    question: "작년 부산 택시 가동률을 주 단위로 평균 낸 다음, 그 주별 평균 중 가장 낮은 값은?"
