# evaluation/grounding_v9/heldout_questions.yaml
#
# 일반화 판정용 held-out 셋. 한 번만 쓴다(prompt·코드 수정에 쓰지 않는다).

version: grounding_v9_heldout
status: heldout
note: >-
  기준일 2026-09-25(금). "어제"=20260924. 상대 날짜는 schema의 pt_date 토큰(last_week, last_month,
  last_year, this_week, this_month, this_year, weekday, weekend)을 쓴다. 작성: Claude 하위 에이전트.
  구현(geoflow/, prompts/, tests/), 기존 grounding 분석·실행 결과, 업체 gold를 읽지 않고 schemas/와
  mock_stub.yaml의 장소 이름, 형식 예시(grounding_v8 od_contrast) 표기만 보고 썼다. 사람 검토 없음.
  od 묶음 24문항은 get_trip_count(장소가 제한하는 끝 × 결과를 묶는 끝), general 묶음 24문항은 나머지 Tool이며
  그중 3문항은 답하지 않아야 하는 문항(needs_clarification 1, unsupported 2)이다. 장소 조회는 질문에 나온
  장소만, region은 질문이 그 장소의 상위 지역을 직접 말할 때만 넣었다.
items:
  # ---------------------------------------------------------------- od
  - id: h01
    group: od
    question: "어제 동대구역에서 택시 탄 건수 좀 알려줘."
    gold_text: |-
      get_place_scope(name=동대구역)
      get_trip_count(scope_pickup=$pickup.scope, date=20260924)
  - id: h02
    group: od
    question: "지난주 저녁 6시부터 8시 사이에 광안리에서 하차한 실차 운행은 몇 건인가요?"
    gold_text: |-
      get_place_scope(name=광안리)
      get_trip_count(scope_dropoff=$dropoff.scope, date=last_week, time=180000-200000)
  - id: h03
    group: od
    question: "이번 달에 수성구 안에서만 오간 택시 운행 건수가 궁금해요."
    gold_text: |-
      get_place_scope(name=수성구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=this_month)
  - id: h04
    group: od
    question: "동성로에서 출발해 동대구역으로 향한 택시는 올해 몇 번 있었어?"
    gold_text: |-
      get_place_scope(name=동성로)
      get_place_scope(name=동대구역)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=this_year)
  - id: h05
    group: od
    question: "주말에 어린이대공원을 출발해 광안리에 도착한 택시 운행 건수를 알려 주세요."
    gold_text: |-
      get_place_scope(name=어린이대공원)
      get_place_scope(name=광안리)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=weekend)
  - id: h06
    group: od
    question: "작년에 대구 중구로 들어온 택시 운행은 총 몇 건이었나요?"
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=last_year)
  - id: h07
    group: od
    question: "지난달 대구 달서구에서 나간 택시들이 어느 구로 많이 갔는지 도착 구별 건수 상위 3곳만 보여줘."
    gold_text: |-
      get_place_scope(name=달서구, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, date=last_month, dimension=sigungu, dimension_target=dropoff, order=top, limit=3)
  - id: h08
    group: od
    question: "이번 달 수성구에서 승차한 건수를 승차한 동별로 나눠서 보여줘."
    gold_text: |-
      get_place_scope(name=수성구)
      get_trip_count(scope_pickup=$pickup.scope, date=this_month, dimension=emd, dimension_target=pickup)
  - id: h09
    group: od
    question: "어제 대구 중구에 내린 실차를 하차 읍면동 기준으로 집계해 줘."
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=20260924, dimension=emd, dimension_target=dropoff)
  - id: h10
    group: od
    question: "지난달 기준으로, 광안리에 도착한 택시들이 어느 구에서 출발했는지 출발 구별 건수 상위 5개를 알려줘."
    gold_text: |-
      get_place_scope(name=광안리)
      get_trip_count(scope_dropoff=$dropoff.scope, date=last_month, dimension=sigungu, dimension_target=pickup, order=top, limit=5)
  - id: h11
    group: od
    question: "지난주 동대구역에서 탄 손님들이 내린 곳을 하차 동별로 묶어서 건수를 보여줘."
    gold_text: |-
      get_place_scope(name=동대구역)
      get_trip_count(scope_pickup=$pickup.scope, date=last_week, dimension=emd, dimension_target=dropoff)
  - id: h12
    group: od
    question: "올해 택시 승차 건수가 가장 적은 구 세 곳은 어디인가요?"
    gold_text: |-
      get_trip_count(date=this_year, dimension=sigungu, dimension_target=pickup, order=bottom, limit=3)
  - id: h13
    group: od
    question: "지난달 택시 하차가 제일 많았던 읍면동 한 곳은 어디야?"
    gold_text: |-
      get_trip_count(date=last_month, dimension=emd, dimension_target=dropoff, order=top, limit=1)
  - id: h14
    group: od
    question: "어제 시군구 단위로 출발지-도착지 조합별 택시 운행 건수를 많은 순으로 10개만 뽑아 줘."
    gold_text: |-
      get_trip_count(date=20260924, dimension=sigungu, dimension_target=both, order=top, limit=10)
  - id: h15
    group: od
    question: "이번 주 대구 안에서 출발과 도착이 모두 이루어진 운행을 출발한 구별로 세어 줘."
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=this_week, dimension=sigungu, dimension_target=pickup)
  - id: h16
    group: od
    question: "평일에 부산진구 안에서 오간 택시 운행을 승차 동과 하차 동의 쌍별로 집계해 줄래?"
    gold_text: |-
      get_place_scope(name=부산진구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=weekday, dimension=emd, dimension_target=both)
  - id: h17
    group: od
    question: "지난달 중구에서 출발해 수성구로 간 택시 건수를 출발 동별로 보여줘."
    gold_text: |-
      get_place_scope(name=중구)
      get_place_scope(name=수성구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_month, dimension=emd, dimension_target=pickup)
  - id: h18
    group: od
    question: "달서구에서 타서 수성구에서 내린 운행을 하차한 동 기준으로, 많은 순서대로 2곳만 알려줘."
    gold_text: |-
      get_place_scope(name=달서구)
      get_place_scope(name=수성구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, dimension=emd, dimension_target=dropoff, order=top, limit=2)
  - id: h19
    group: od
    question: "지난주 수성구에 도착한 택시 운행을 출발 동과 도착 동의 짝별로 세어 줘."
    gold_text: |-
      get_place_scope(name=수성구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=last_week, dimension=emd, dimension_target=both)
  - id: h20
    group: od
    question: "올해 기준으로 대구에서 출발한 택시의 출발 구·도착 구 조합 가운데 건수가 가장 많은 다섯 개는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$pickup.scope, date=this_year, dimension=sigungu, dimension_target=both, order=top, limit=5)
  - id: h21
    group: od
    question: "어제 오전 7시부터 9시까지 택시 승차가 많았던 H3 셀 상위 3개를 알려주세요."
    gold_text: |-
      get_trip_count(date=20260924, time=070000-090000, dimension=h3, dimension_target=pickup, order=top, limit=3)
  - id: h22
    group: od
    question: "작년 택시 하차 건수를 시도별로 정리해 주세요."
    gold_text: |-
      get_trip_count(date=last_year, dimension=sido, dimension_target=dropoff)
  - id: h23
    group: od
    question: "평일에 동대구역 주변에서 택시를 잡아 탄 건수는 얼마나 돼?"
    gold_text: |-
      get_place_scope(name=동대구역, include_vicinity=true)
      get_trip_count(scope_pickup=$pickup.scope, date=weekday)
  - id: h24
    group: od
    question: "이번 달 두류동에서 내린 택시들이 탄 구를 보면, 건수가 가장 적은 두 곳은 어디야?"
    gold_text: |-
      get_place_scope(name=두류동)
      get_trip_count(scope_dropoff=$dropoff.scope, date=this_month, dimension=sigungu, dimension_target=pickup, order=bottom, limit=2)

  # ---------------------------------------------------------------- general
  - id: h25
    group: general
    question: "어제 동성로를 지나간 택시 통행량은 얼마였나요?"
    gold_text: |-
      get_place_scope(name=동성로)
      get_passage_count(scope=$resolve.scope, date=20260924)
  - id: h26
    group: general
    question: "지난주 대구 중구에서 빈 차로 돌아다닌 택시 통행량을 알려줘."
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_passage_count(scope=$resolve.scope, date=last_week, taxi_status=vacant)
  - id: h27
    group: general
    question: "이번 달 대구에서 개인택시 통행량이 가장 많은 읍면동 상위 5곳은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=this_month, taxi_type=private, dimension=emd, order=top, limit=5)
  - id: h28
    group: general
    question: "주말 밤 9시부터 11시까지 광안리 근처를 지난 택시 통행량은 얼마나 돼?"
    gold_text: |-
      get_place_scope(name=광안리, include_vicinity=true)
      get_passage_count(scope=$resolve.scope, date=weekend, time=210000-230000)
  - id: h29
    group: general
    question: "어제 동대구역에서 대기영업 중이던 법인택시의 통행량을 알려 주세요."
    gold_text: |-
      get_place_scope(name=동대구역)
      get_passage_count(scope=$resolve.scope, date=20260924, taxi_type=corporate, taxi_status=stationary)
  - id: h30
    group: general
    question: "부산에서 손님을 태운 택시 통행량이 가장 적은 구 두 곳은 어디야?"
    gold_text: |-
      get_place_scope(name=부산)
      get_passage_count(scope=$resolve.scope, taxi_status=occupied, dimension=sigungu, order=bottom, limit=2)
  - id: h31
    group: general
    question: "지난달 수성구를 지난 택시들의 평균 속도는 얼마였어?"
    gold_text: |-
      get_place_scope(name=수성구)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=last_month)
  - id: h32
    group: general
    question: "어제 오전 7시부터 9시 사이 동성로 부근에서 택시가 낸 최고 속도는?"
    gold_text: |-
      get_place_scope(name=동성로, include_vicinity=true)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=20260924, time=070000-090000, aggregation=max)
  - id: h33
    group: general
    question: "올해 부산 광안동을 지난 택시들의 rpm 중간값을 알려줘."
    gold_text: |-
      get_place_scope(name=광안동, region=부산)
      get_passage_metrics(metric=rpm, scope=$resolve.scope, date=this_year, aggregation=med)
  - id: h34
    group: general
    question: "지난주 대구 소속 택시들의 평균 요금은 얼마인가요?"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_metrics(metric=fare, scope=$resolve.scope, date=last_week)
  - id: h35
    group: general
    question: "평일 저녁 6시부터 8시 사이에 수성구 소속 택시가 받은 요금 가운데 가장 높은 금액은?"
    gold_text: |-
      get_place_scope(name=수성구)
      get_trip_metrics(metric=fare, scope=$resolve.scope, date=weekday, time=180000-200000, aggregation=max)
  - id: h36
    group: general
    question: "scope:district:2726000000 이 어느 지역인지 이름으로 알려줘."
    gold_text: |-
      get_scope_name(scope=scope:district:2726000000)
  - id: h37
    group: general
    question: "지난달 달서구 택시의 공차율은 어느 정도였나요?"
    gold_text: |-
      get_place_scope(name=달서구)
      get_drive_metrics(metric=vacant_ratio, scope=$resolve.scope, date=last_month)
  - id: h38
    group: general
    question: "작년 부산 개인택시 공차율의 최댓값을 알려 주세요."
    gold_text: |-
      get_place_scope(name=부산)
      get_drive_metrics(metric=vacant_ratio, scope=$resolve.scope, date=last_year, taxi_type=private, aggregation=max)
  - id: h39
    group: general
    question: "주말 오전 10시에서 12시 사이 법인택시 공차율은?"
    gold_text: |-
      get_drive_metrics(metric=vacant_ratio, date=weekend, time=100000-120000, taxi_type=corporate)
