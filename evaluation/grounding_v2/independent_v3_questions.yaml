# independent_v3 questions.yaml
#
# 질문 해석 코드와 독립으로 만든 새 평가셋(초안).
#
# - 작성: Claude subagent(질문 작성자). 해석 코드(geoflow/), tests/, 이전 분석·실행 결과
#   (grounding_v1/v2의 analysis.md, runs/, audit.md), git 이력을 보지 않고 작성했다.
#   참고한 것은 schemas/*.yaml, prompts/system.yaml, mock_stub.yaml의 gazetteer,
#   evaluation/vendor100/gold.yaml(표기 규칙), grounding_v1/holdout_questions.yaml,
#   grounding_v2/independent_questions.yaml, grounding_v2/contrast_questions.yaml(형식, 유사 문장 회피)뿐이다.
# - 사람 검토 없음(not human-reviewed). 업체 정답이 아니다.
# - 상대 날짜 기준일: 2026-09-25 (Asia/Seoul). 대부분 last_month 같은 토큰이나 YYYYMMDD로 적었다.
# - 기존 네 파일(업체 100문항, grounding_v1 holdout, grounding_v2 독립셋·대조셋)의 모든 문장과
#   difflib 문자 유사도 0.7 이하가 되도록 문장 틀을 새로 썼다. 장소는 mock gazetteer에 있는 이름만 쓴다.
# - gold 표기는 evaluation/vendor100/gold.yaml과 같다: `tool(k=v, ...)` 줄, 장소 결과는
#   $resolve/$pickup/$dropoff/$area.scope. taxi_type=all, taxi_status=all,
#   include_vicinity=false 같은 기본값은 적지 않는다. metric tool의 aggregation(avg 포함)과
#   dimension 지정 시 dimension_target(both 포함)은 적는다. 단일 최상·최하는 limit=1.
# - 두 장소 질문의 get_place_scope 순서는 승차지 먼저, 하차지 나중이다(문장 순서와 무관).
#   $pickup/$dropoff가 조회 순서로 묶이기 때문이다.
# - expected_outcome이 answered가 아니면 gold 호출이 없고, 결과 종류만 채점한다.
#
# 구성: m01-m25 의미 구분(승하차 끝 vs 집계 대상 끝, OD 방향·한 지역 내부 OD,
#       순위 방향 vs 집계 연산, 주·월 2단계 집계), m26-m40 일반 사용과 조건 미지원.
#
# 라벨 점검과 수정(evaluate_vendor100.py gold, LLM 미사용. 저장소 밖 파일이라 gold_file 메타 경로만 바꾸는
# 래퍼로 실행했다):
# - m10: 승차 장소 교체(장소 대체). mock gazetteer가 그 시군구를 name+region 조회로 찾지 못했다(NOT_FOUND).
#   문장 틀과 의미 구분(하차지를 뒤에 둔 OD 두 장소, 시간대)은 그대로다.
# - m11: 하차 장소 교체(장소 대체). mock에 그 시군구 아래 읍면동 데이터가 없어 읍면동 노선 조회가
#   UNSUPPORTED_COMBINATION이었다. 문장 틀(하차지 먼저 말하는 OD, both 그룹)은 그대로다.
# - m17: 질문 재작성(집계 연산 교체). 일별 고유 대수인 활성택시 대수의 합(sum)은 정의되지 않는다
#   (UNDEFINED_MEASURE_AGGREGATION). 순위 방향과 집계 연산이 엇갈리는 구성(min + top)으로 바꿨다.
# - m23: 질문 재작성(rollup 교체). 같은 이유로 월 값들의 합(sum) 대신 최댓값(max)으로 바꿨다.

version: independent_v3
status: preregistered
items:
  # ── 승하차 끝(scope) vs 결과를 묶는 끝(dimension_target) ──
  - id: m01
    question: "지난달 대구 동인동이 목적지였던 손님들은 주로 어느 읍면동에서 택시를 잡았어? 많은 순으로 5곳만."
