    expected_outcome: needs_clarification
    why: "주 bucket과 rollup(max)은 있지만, 각 주 안에서 운행 일수를 합할지 평균할지(구간 안 집계)가 질문에 없다. 기본값(avg)으로 채우지 않는다"
    gold_grounding:
      concepts:
        - {id: place, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 인천, region: ""}}
        - {id: event, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: measure, concept: AMOUNT, subtype: operating_days, role: MEASURE, source: implicit}
      factors: {date: last_year, bucket: week, rollup: max}
  - id: m25
    question: "올해 월별로 부산 소속 택시 수입 합계를 비교하면 어느 달이 제일 벌이가 좋았어?"
    expected_outcome: unsupported
    why: "값이 아니라 구간(어느 달)을 묻는다. get_billing_metrics의 bucket/rollup은 스칼라 대표값만 반환하고 달 라벨을 돌려주지 않는다"

