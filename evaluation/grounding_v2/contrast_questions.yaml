# evaluation/grounding_v2/contrast_questions.yaml
#
# 의미 대조 사례(개발용). 한 group 안의 문장은 역할·방향·범위·집계어 하나만 다르고, 정답 호출도 그만큼만
# 다르다. "표현을 바꿔도 같은 답"이 아니라 "뜻이 바뀌면 답도 바뀌는가"를 본다.
#
# - 작성: Claude(주 에이전트, 해석 규칙을 만든 쪽). 사람 검토 없음. 업체 정답이 아니다.
# - 개발셋이다. 후보를 고르고 규칙을 고치는 데 쓴다. 일반화 성능으로 보고하지 않는다.
# - 형식은 grounding_v1/holdout_questions.yaml과 같다. group은 대조 묶음, contrast는 바뀐 한 가지.
# - 업체 100문항·기존 44문항의 문장을 그대로 옮기지 않았다(같은 현상, 다른 장소·날짜·문장 틀).
# - 장소는 mock gazetteer에 있는 이름만 쓴다. 기준일 2026-09-25.

version: grounding_v2_contrast
status: development
items:
  # C1. 장소가 거르는 끝(승차/하차)만 바뀜. "에서" 뒤의 서술어가 역할을 정한다.
  - id: c01a
    group: C1
    contrast: "에서 + 승차"
    question: "지난주 부산에서 승차가 많은 읍면동 상위 3곳은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_trip_count(scope_pickup=$pickup.scope, date=last_week, dimension=emd, dimension_target=pickup, order=top, limit=3)
  - id: c01b
    group: C1
    contrast: "에서 + 하차"
    question: "지난주 부산에서 하차가 많은 읍면동 상위 3곳은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_trip_count(scope_dropoff=$dropoff.scope, date=last_week, dimension=emd, dimension_target=dropoff, order=top, limit=3)

  # C2. 거르는 끝과 묶는 끝이 서로 다름.
  - id: c02a
    group: C2
    contrast: "출발지로 거르고 도착지로 묶음"
    question: "대구 수성구에서 출발한 실차의 도착 읍면동 상위 2곳은?"
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, dimension=emd, dimension_target=dropoff, order=top, limit=2)
  - id: c02b
    group: C2
    contrast: "도착지로 거르고 출발지로 묶음"
    question: "대구 수성구에 도착한 실차의 출발 읍면동 상위 2곳은?"
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, dimension=emd, dimension_target=pickup, order=top, limit=2)
  - id: c02c
    group: C2
    contrast: "에서 + 하차로 거르고 승차지로 묶음"
    question: "대구 수성구에서 하차한 실차의 승차 읍면동 상위 2곳은?"
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, dimension=emd, dimension_target=pickup, order=top, limit=2)

  # C3. 출발·도착 뒤집기, 한쪽만 거르기.
  - id: c03a
    group: C3
    contrast: "동인동 → 초량동"
    question: "이번 주 대구 동인동에서 부산 초량동으로 간 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=동인동, region=대구)
      get_place_scope(name=초량동, region=부산)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=this_week)
  - id: c03b
    group: C3
    contrast: "초량동 → 동인동"
    question: "이번 주 부산 초량동에서 대구 동인동으로 간 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=초량동, region=부산)
      get_place_scope(name=동인동, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=this_week)
  - id: c03c
    group: C3
    contrast: "도착만"
    question: "이번 주 대구 동인동으로 들어온 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=동인동, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=this_week)
  - id: c03d
    group: C3
    contrast: "출발만"
    question: "이번 주 대구 동인동에서 나간 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=동인동, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, date=this_week)

  # C4. 같은 지역 안의 OD와 두 지역 사이의 OD. 같은 지역이면 조회 한 번, 같은 scope를 양쪽에.
  - id: c04a
    group: C4
    contrast: "대구 안"
    question: "지난달 대구 안에서 이동한 읍면동 간 노선 상위 3개는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=last_month, dimension=emd, dimension_target=both, order=top, limit=3)
  - id: c04b
    group: C4
    contrast: "대구 → 부산"
    question: "지난달 대구에서 부산으로 이동한 읍면동 간 노선 상위 3개는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_place_scope(name=부산)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_month, dimension=emd, dimension_target=both, order=top, limit=3)
  - id: c04c
    group: C4
    contrast: "부산 안, 그룹 없음"
    question: "지난달 부산 안에서 이동한 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=부산)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=last_month)

  # C5. 순위 방향.
  - id: c05a
    group: C5
    contrast: "상위"
    question: "주말 대구의 시군구별 택시 통행량 상위 2곳은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=weekend, dimension=sigungu, order=top, limit=2)
  - id: c05b
    group: C5
    contrast: "하위"
    question: "주말 대구의 시군구별 택시 통행량 하위 2곳은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=weekend, dimension=sigungu, order=bottom, limit=2)
  - id: c05c
    group: C5
    contrast: "가장 적은 한 곳"
    question: "주말 대구에서 택시 통행량이 가장 적은 시군구는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=weekend, dimension=sigungu, order=bottom, limit=1)

  # C6. 순위 방향과 측정값의 집계 연산을 따로 읽는다.
  - id: c06a
    group: C6
    contrast: "평균 + 가장 낮은 곳"
    question: "지난달 시도별 평균 수입이 가장 낮은 곳은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_month, aggregation=avg, dimension=sido, order=bottom, limit=1)
  - id: c06b
    group: C6
    contrast: "최대 + 가장 낮은 곳"
    question: "지난달 시도별 최대 수입이 가장 낮은 곳은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_month, aggregation=max, dimension=sido, order=bottom, limit=1)
  - id: c06c
    group: C6
    contrast: "순위 없이 최솟값"
    question: "지난달 부산 소속 택시의 수입 최솟값은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_billing_metrics(metric=revenue, scope=$resolve.scope, date=last_month, aggregation=min)

  # C7. 집계어를 더하고 빼기(구간 없음).
  - id: c07a
    group: C7
    contrast: "집계어 없음"
    question: "이번 달 시도별 법인택시 수입이 가장 큰 곳은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=this_month, taxi_type=corporate, dimension=sido, order=top, limit=1)
  - id: c07b
    group: C7
    contrast: "합계"
    question: "이번 달 시도별 법인택시 수입 합계가 가장 큰 곳은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=this_month, taxi_type=corporate, aggregation=sum, dimension=sido, order=top, limit=1)
  - id: c07c
    group: C7
    contrast: "집계어 없음"
    question: "지난주 부산 초읍동 어린이대공원 근처의 택시 속도는?"
    gold_text: |-
      get_place_scope(name=어린이대공원, region=부산 초읍동, include_vicinity=true)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=last_week)
  - id: c07d
    group: C7
    contrast: "중간값"
    question: "지난주 부산 초읍동 어린이대공원 근처의 택시 속도 중간값은?"
    gold_text: |-
      get_place_scope(name=어린이대공원, region=부산 초읍동, include_vicinity=true)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=last_week, aggregation=med)

  # C8. 두 단계 집계. 구간 안 집계가 없으면 확인 요청, 구간 자체를 물으면 지원 안 함.
  - id: c08a
    group: C8
    contrast: "구간 안 합계, 구간 사이 평균"
    question: "지난해 월별 법인택시 수입 합계의 평균은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_year, taxi_type=corporate, bucket=month, aggregation=sum, rollup=avg)
  - id: c08b
    group: C8
    contrast: "구간 안 집계 없음"
    question: "지난해 월별 법인택시 수입의 평균은?"
    expected_outcome: needs_clarification
    why: "각 달 안에서 합할지 평균할지가 질문에 없다(AMBIGUOUS_INNER_AGGREGATION)"
    gold_grounding:
      concepts:
        - {id: event, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: measure, concept: AMOUNT, subtype: revenue, role: MEASURE, source: implicit}
      factors: {date: last_year, taxi_type: corporate, bucket: month, rollup: avg}
  - id: c08c
    group: C8
    contrast: "값이 아니라 그 달을 물음"
    question: "지난해 법인택시 수입 합계가 가장 큰 달은?"
    expected_outcome: unsupported
    why: "bucket/rollup은 대표값만 돌려주고 어느 달인지는 돌려주지 않는다"
  - id: c08d
    group: C8
    contrast: "구간 안 합계, 구간 사이 최댓값"
    question: "지난해 월별 법인택시 수입 합계 중 가장 큰 값은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_year, taxi_type=corporate, bucket=month, aggregation=sum, rollup=max)
  - id: c08e
    group: C8
    contrast: "구간 안 평균, 구간 사이 최솟값"
    question: "지난해 월별 평균 법인택시 수입 중 가장 작은 값은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_year, taxi_type=corporate, bucket=month, aggregation=avg, rollup=min)

  # C9. 가장 큰 값과 그 값을 가진 지역.
  - id: c09a
    group: C9
    contrast: "지역을 고름"
    question: "지난달 대구 시군구 가운데 택시 통행량이 가장 많은 곳은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=last_month, dimension=sigungu, order=top, limit=1)
  - id: c09b
    group: C9
    contrast: "지역 전체 값"
    question: "지난달 대구의 택시 통행량은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=last_month)

  # C10. 한쪽 끝으로 묶기와 출발·도착 조합으로 묶기.
  - id: c10a
    group: C10
    contrast: "하차 읍면동으로 묶음"
    question: "이번 달 부산 초량동에서 출발한 실차의 하차 읍면동 하위 2곳은?"
    gold_text: |-
      get_place_scope(name=초량동, region=부산)
      get_trip_count(scope_pickup=$pickup.scope, date=this_month, dimension=emd, dimension_target=dropoff, order=bottom, limit=2)
  - id: c10b
    group: C10
    contrast: "읍면동 간 노선으로 묶음"
    question: "이번 달 부산 초량동에서 출발한 실차의 읍면동 간 노선 하위 2개는?"
    gold_text: |-
      get_place_scope(name=초량동, region=부산)
      get_trip_count(scope_pickup=$pickup.scope, date=this_month, dimension=emd, dimension_target=both, order=bottom, limit=2)
