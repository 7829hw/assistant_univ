# 국소 집계 보정(H0 vs L1) 검증용 fresh holdout 부모 질의.
#
# L1 보정 prompt(22c501ff)를 고정한 cb2d0e0 뒤, 어떤 L1 측정 결과도 보기 전에 작성했다.
# 사람이 썼다(qwen 사용 안 함). 결과를 보고 문구를 고치지 않는다. development
# corpus와 stub 질의의 문장·intent를 쓰지 않았다.
#
# 앞 절반은 구간 집계(보정 대상), 뒤 절반은 보정이 일어나면 안 되는 대조군이다.
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다.

# --- A. 구간 안 집계와 최종 집계를 모두 말한다 ---
- id: l01_week_sum_then_avg_revenue
  question: "주마다 번 수입을 합친 금액의 평균은?"
  expected_concepts: [EVENT/operation:SUPPORT, AMOUNT/revenue:MEASURE]
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

