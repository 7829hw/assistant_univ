# 의미 검증기(H0 vs V0) 검증용 fresh holdout 부모 질의.
#
# V0 검증 prompt(cad71775)를 고정한 663959e 뒤, V0 holdout 결과를 보기 전에 작성했다.
# 사람이 썼다(qwen 사용 안 함). 결과를 보고 문구를 고치지 않는다. development corpus와
# stub 질의의 문장·intent를 쓰지 않았다. family마다 H0가 틀리기 쉬운 질의 셋과 올바른 계획
# 대조군 하나를 둔다.
#
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다.

# --- A. 집계 단계 ---
- id: v01_week_sum_then_max_hours
