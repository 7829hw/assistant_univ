# v1 조건 평가 셋(eval_questions_v1.yaml, eval_questions_conditions_v1.yaml)의 gold는 상대 기간을
# pt_date 글자(last_month 등)로만 적었다. 그 결과 같은 뜻의 절대 범위를 "changed"로 채점했다.
# 이 파일은 원래 gold를 바꾸지 않고, 기준일 2026-09-25(금, Asia/Seoul)의 동치 범위를 손으로
# 센 값으로 더한다. condition_scoring v2의 정정 분석에서만 쓴다(2026-09-26 작성).
#   last_week : 이번 주 월요일 2026-09-21의 직전 월~일 → 20260914-20260920
#   last_month: 2026년 8월 → 20260801-20260831
#   last_year : 2025년 → 20250101-20251231
reference_date: "2026-09-25"
date_equivalents:
  last_week: ["20260914-20260920"]
  last_month: ["20260801-20260831"]
  last_year: ["20250101-20251231"]
