# evaluation/grounding_v12/final_questions.yaml
#
# 최종 검증용 held-out 셋. 한 번만 쓴다(새 grounding 모델·계약 설명·코드를 기본값으로 채택할지 판정).

version: grounding_v12_final
status: heldout
note: >-
  기준일 2026-09-25(금), 어제=20260924, 그저께=20260923, 상대 날짜는 schema의 pt_date 토큰(last_week, last_month,
  last_year, this_week, this_month, this_year, weekday, weekend, holiday)으로 적는다. 작성: Claude 하위 에이전트.
  schemas/(Tool 계약), mock_stub.yaml gazetteer와 mock_responses.py의 장소 해석·dimension 후보, 형식 예시 파일 하나,
  evaluate_vendor100.py의 parse_calls/load_gold/_binding_place/score만 읽고 썼다. geoflow/·prompts/·tests/·다른 평가
  자료는 읽지 않았고 모델을 부르지 않았다. 사람 검토 없음. 정답 규칙: 질문에 나온 장소만 먼저 조회하고(region은
  상위 지역이 질문에 있을 때만), 분석 호출은 하나, 질문이 요구하지 않은 인자는 넣지 않는다. 답하면 안 되는 문항은
  expected_outcome과 required_condition(버리면 안 되는 조건)을 적는다. 실행기(gold 모드) 확인 후 수정: 없음.
items:
  # 1. rank_return: 순위·묶음으로 장소/요일/지역을 돌려주는 질문
  - id: f01
    group: rank_return
    question: "지난주 동대구역에서 택시를 탄 손님들이 가장 많이 내린 읍면동 상위 세 곳은 어디야?"
    gold_text: |-
      get_place_scope(name=동대구역)
      get_trip_count(scope_pickup=$pickup.scope, date=last_week, dimension=emd, dimension_target=dropoff, order=top, limit=3)
  - id: f02
    group: rank_return
    question: "어제 대구 수성구에 내린 택시 승객들은 주로 어느 구에서 탔나요? 가장 많은 구 하나만 알려주세요."
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_trip_count(scope_dropoff=$dropoff.scope, date=20260924, dimension=sigungu, dimension_target=pickup, order=top, limit=1)
  - id: f03
    group: rank_return
    question: "지난달 택시 승차 건수를 시군구별로 봤을 때 가장 적었던 두 곳은?"
    gold_text: |-
      get_trip_count(date=last_month, dimension=sigungu, dimension_target=pickup, order=bottom, limit=2)
  - id: f04
    group: rank_return
    question: "이번 달 대구 안에서 타고 대구 안에서 내린 택시 운행을, 탄 동네(읍면동) 기준으로 많은 순서대로 다섯 곳만 뽑아 줘."
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=this_month, dimension=emd, dimension_target=pickup, order=top, limit=5)
  - id: f05
    group: rank_return
    question: "지난주 대구에서 택시 통행량이 제일 많았던 동 세 곳이 어디죠?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$area.scope, date=last_week, dimension=emd, order=top, limit=3)
  - id: f06
    group: rank_return
    question: "어제 부산 택시 통행량을 구별로 보면 가장 한산했던 구는 어디였어?"
    gold_text: |-
      get_place_scope(name=부산)
      get_passage_count(scope=$area.scope, date=20260924, dimension=sigungu, order=bottom, limit=1)
  - id: f07
    group: rank_return
    question: "주말 기준으로 대구 중구에서 택시가 가장 많이 지나다닌 H3 격자 두 곳을 알려 주세요."
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_passage_count(scope=$area.scope, date=weekend, dimension=h3, order=top, limit=2)
  - id: f08
    group: rank_return
    question: "지난달 택시 하루 수익금이 가장 높았던 요일은 무슨 요일이야?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_month, dimension=dayofweek, order=top, limit=1)
  - id: f09
    group: rank_return
    question: "올해 시도별 택시 가동률을 비교하면 어느 시도가 제일 낮아요?"
    gold_text: |-
      get_billing_metrics(metric=active_taxi_ratio, date=this_year, dimension=sido, order=bottom, limit=1)
  - id: f10
    group: rank_return
    question: "작년 법인택시 운행일 지표가 높은 시도 상위 두 곳은?"
    gold_text: |-
      get_billing_metrics(metric=operating_days, date=last_year, taxi_type=corporate, dimension=sido, order=top, limit=2)

