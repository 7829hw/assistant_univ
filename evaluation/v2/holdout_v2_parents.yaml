# 업체 v2 계약 기준 holdout 부모 질의 (holdout_v2).
#
# 2026-09-29 작성. 사람이 아니라 Claude가 썼고 사용자 검토 전이다(corpus_registry review 참고).
# 설계 기준·채점 규칙은 evaluation/v2/preregistration_v2.md에 모델 실행 전에 고정했다.
# 결과를 보고 문구·라벨을 고치지 않는다.
#
# v1 corpus에서 v2에 없는 측정값(영업 시간·영업 횟수) 때문에 지원 범위 밖이 된 intent의 검사
# 능력(두 단계 집계, stage-swap, 대조군, verifier 오류 유형)을 v2에서 뜻이 정해진 측정값(요금,
# 운행일수, 공차율, 속도)으로 되살렸다(A·B·C). metric 이름만 바꾸지 않고 질문을 새로 썼다.
# D는 거부 동작, E는 v2 경계 동작이다.
#
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다. 계획은 만들어지지만
# 계약상 실행하지 않는 질의(구간 안 avg 등)는 라벨이 계획을 가리키고, 기대 결과는 corpus의
# expected_outcome에 적는다. 라벨은 golden grounding을 실제 composer로 조합해 얻었다.

