# 업체 v2 계약 기준 holdout paraphrase corpus (holdout_v2).
#
# 2026-09-29 작성. Claude가 썼고 사용자 검토 전이다. 어순·조사·수식어 위치만 바꿨고 동의어를
# 쓰지 않았다(evaluation/paraphrases.yaml 작성 원칙). 모델 실행 전에 sha256을 registry에 고정했다.
# 결과를 보고 문구·라벨·기준을 고치지 않는다.
#
# 항목(기존 corpus 형식에 더한 것)
#   expected_outcome  answered | needs_clarification | unsupported. 현재 제품 계약(mock + legacy,
#                     기준일 2026-09-25)에서 기대하는 결과.
#   capability        이 intent가 검증하려는 능력.
#   rationale         정답 근거(schema·prompt·README 문장, geoflow/measures.py).
#   restores          되살린 v1 intent(v2에서 지원 범위 밖이 된 것).
#   aggregation       두 단계 집계 의미 golden. 기대 Tool 인자의 집계 부분은 여기서 유도한다.
#   expected_tool_args 최종 Tool 호출 인자 중 반드시 맞아야 하는 것. null은 "없어야 한다",
#                     "@place:이름"은 그 장소에서 만든 scope다.
version: 1
parents: [evaluation/v2/holdout_v2_parents.yaml]

intents:

  # --- A. aggregation holdout 복원 (v1 a01·a04·a05·a06·a11·a12·a13·a15·a17·a18) ---

  - intent: w01_last_month_week_sum_then_avg_fare
    cohorts: [aggregation_stage]
    expected_outcome: answered
    restores: a01_week_sum_then_avg_hours
    capability: "명시된 구간 안 합계와 구간별 값의 평균(두 단계, A_explicit_inner)"
    rationale: "'주마다 합한'이 구간 안 sum, '평균'이 구간별 값의 avg. fare는 trip 기록마다의 요금이라 합·최대·최소가 기록에 바로 정의된다(geoflow/measures.py EXTENSIVE_VALUE)."
    aggregation: {bucket: week, inner: sum, final: avg}
    expected_tool_args: {metric: fare, date: last_month}
    must_include: [[지난달], [주마다], [합한, 합하면], [평균], [요금]]
    golden:
      concepts:
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: fare, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: last_month}
    paraphrases:
      - {id: w01_p0, question: "지난달 주마다 합한 택시 요금의 평균은?", note: 원문}
      - {id: w01_p1, question: "택시 요금을 지난달 주마다 합한 값의 평균은?", note: 어순}
      - {id: w01_p2, question: "지난달 택시 요금을 주마다 합하면 그 평균은?", note: 절}

  - intent: w02_last_month_week_min_then_avg_fare
    cohorts: [aggregation_stage]
    expected_outcome: answered
    restores: a04_week_min_then_avg_count
    capability: "구간 안 최솟값과 구간별 값의 평균(두 단계, stage-swap 대상)"
    rationale: "'매주 가장 낮았던'이 구간 안 min, '평균'이 구간별 값의 avg. 순서를 바꾸면(avg→min) 다른 값이다. fare는 trip 기록마다의 요금이라 합·최대·최소가 기록에 바로 정의된다(geoflow/measures.py EXTENSIVE_VALUE)."
    aggregation: {bucket: week, inner: min, final: avg}
    expected_tool_args: {metric: fare, date: last_month}
    must_include: [[지난달], [매주], [가장 낮았던], [평균], [요금]]
    golden:
      concepts:
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: fare, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: last_month}
    paraphrases:
      - {id: w02_p0, question: "지난달 매주 가장 낮았던 택시 요금의 평균은?", note: 원문}
      - {id: w02_p1, question: "지난달 택시 요금이 매주 가장 낮았던 값의 평균은?", note: 어순}
      - {id: w02_p2, question: "매주 가장 낮았던 택시 요금을 지난달 기준으로 평균 내면?", note: 절}

  - intent: w03_jul_aug_month_sum_then_min_days
    cohorts: [aggregation_stage]
    expected_outcome: answered
    restores: a05_month_sum_then_min_hours
    capability: "월 구간 안 합계와 구간별 값의 최솟값(두 단계)"
    rationale: "'달마다 합한'이 구간 안 sum, '가장 작은 값'이 구간별 값의 min(값을 묻는다). 운행일수는 택시별 기간 안 운행일을 센 뒤 aggregation으로 택시 전체를 모은다(업체 v2 README). 하루 값(택시마다 0/1)의 합은 기간 합과 같다."
    aggregation: {bucket: month, inner: sum, final: min}
    expected_tool_args: {metric: operating_days, date: 20260701-20260831}
    must_include: [[2026년 7월부터 8월까지], [달마다], [합한], [가장 작은], [운행일수]]
    golden:
      concepts:
        - {id: op, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: days, concept: AMOUNT, subtype: operating_days, role: MEASURE, source: implicit}
      factors: {date: 20260701-20260831}
    paraphrases:
      - {id: w03_p0, question: "2026년 7월부터 8월까지 달마다 합한 운행일수 가운데 가장 작은 값은?", note: 원문}
      - {id: w03_p1, question: "달마다 합한 운행일수 가운데 2026년 7월부터 8월까지 가장 작은 값은?", note: 어순}
      - {id: w03_p2, question: "2026년 7월부터 8월까지 운행일수를 달마다 합한 값 가운데 가장 작은 값은?", note: 절}

  - intent: w04_last_month_week_unspecified_max_fare
    cohorts: [aggregation_stage]
    expected_outcome: needs_clarification
    restores: a06_week_unspecified_max_count
    capability: "구간 안 집계가 없는 두 단계 질문을 기본값으로 채우지 않는지(B_inner_unspecified)"
    rationale: "구간 안 집계가 질문에 없다. 합계·평균·최댓값 중 무엇인지 정해지지 않아 제품은 AMBIGUOUS_INNER_AGGREGATION으로 사용자 확인을 요청한다(Tool 기본값 avg를 쓰지 않음)."
    aggregation: {bucket: week, inner: unspecified, final: max}
    expected_tool_args: {metric: fare, date: last_month}
    must_include: [[지난달], [주별], [최댓값], [요금]]
    must_exclude: [합, 평균, 가장 높았던]
    golden:
      concepts:
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: fare, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: last_month}
    paraphrases:
      - {id: w04_p0, question: "지난달 주별 택시 요금의 최댓값은?", note: 원문}
      - {id: w04_p1, question: "택시 요금의 지난달 주별 최댓값은?", note: 어순}
      - {id: w04_p2, question: "지난달 택시 요금을 주별로 보면 최댓값은?", note: 절}

  - intent: w05_jul_aug_month_avg_then_sum_fare
    cohorts: [aggregation_stage]
    expected_outcome: unsupported
    restores: a11_month_avg_then_sum_count
    capability: "구간 안 평균과 구간별 값의 합계(C_inner_avg). 의미 graph와 계약 미확인 거부"
    rationale: "'달마다 평균 낸'이 구간 안 avg, '모두 합하면'이 구간별 값의 sum. 구간 안 avg는 하루 값으로 다시 만들 수 없고(tims_contract DECOMPOSABLE_INNER), 구간 범위 호출은 range_inclusive가 계약에 없어(OBSERVED) 현재 계약에서는 실행하지 않는다. 의미 graph(구간·구간 안·구간별 집계)는 채점한다."
    aggregation: {bucket: month, inner: avg, final: sum}
    expected_tool_args: {metric: fare, date: 20260701-20260831}
    must_include: [[2026년 7월부터 8월까지], [달마다], [평균 낸], [모두 합하면], [요금]]
    golden:
      concepts:
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: fare, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: 20260701-20260831}
    paraphrases:
      - {id: w05_p0, question: "2026년 7월부터 8월까지 달마다 평균 낸 택시 요금을 모두 합하면?", note: 원문}
      - {id: w05_p1, question: "달마다 평균 낸 택시 요금을 2026년 7월부터 8월까지 모두 합하면?", note: 어순}
      - {id: w05_p2, question: "2026년 7월부터 8월까지 택시 요금을 달마다 평균 낸 값을 모두 합하면?", note: 절}

  - intent: w06_jul_aug_month_avg_then_min_days
    cohorts: [aggregation_stage]
    expected_outcome: unsupported
    restores: a12_month_avg_then_min_hours
    capability: "구간 안 평균과 구간별 값의 최솟값(C_inner_avg). 의미 graph와 계약 미확인 거부"
    rationale: "'각 달의 평균'이 구간 안 avg, '가장 작은 값'이 구간별 값의 min. 구간 안 avg는 하루 값으로 다시 만들 수 없고(tims_contract DECOMPOSABLE_INNER), 구간 범위 호출은 range_inclusive가 계약에 없어(OBSERVED) 현재 계약에서는 실행하지 않는다. 의미 graph(구간·구간 안·구간별 집계)는 채점한다."
    aggregation: {bucket: month, inner: avg, final: min}
    expected_tool_args: {metric: operating_days, date: 20260701-20260831}
    must_include: [[2026년 7월부터 8월까지], [각 달의], [평균], [가장 작은], [운행일수]]
    golden:
      concepts:
        - {id: op, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: days, concept: AMOUNT, subtype: operating_days, role: MEASURE, source: implicit}
      factors: {date: 20260701-20260831}
    paraphrases:
      - {id: w06_p0, question: "2026년 7월부터 8월까지 각 달의 평균 운행일수 중 가장 작은 값은?", note: 원문}
      - {id: w06_p1, question: "각 달의 평균 운행일수 중 2026년 7월부터 8월까지 가장 작은 값은?", note: 어순}
      - {id: w06_p2, question: "2026년 7월부터 8월까지 운행일수를 각 달의 평균으로 보면 가장 작은 값은?", note: 절}

  - intent: w07_last_week_avg_fare
    cohorts: [aggregation_stage]
    expected_outcome: answered
    restores: a13_avg_hours
    capability: "구간 없는 한 단계 평균을 두 단계로 만들지 않는지(D_no_bucket)"
    rationale: "구간 표현이 없다. '지난주'는 기간이지 구간이 아니다. 한 단계 avg. fare는 trip 기록마다의 요금이라 합·최대·최소가 기록에 바로 정의된다(geoflow/measures.py EXTENSIVE_VALUE)."
    aggregation: {final: avg}
    expected_tool_args: {metric: fare, date: last_week}
    must_include: [[지난주], [평균값], [요금]]
    must_exclude: [주별, 매주, 주마다]
    golden:
      concepts:
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: fare, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: last_week}
    paraphrases:
      - {id: w07_p0, question: "지난주 택시 요금의 평균값은?", note: 원문}
      - {id: w07_p1, question: "택시 요금의 지난주 평균값은?", note: 어순}
      - {id: w07_p2, question: "지난주의 택시 요금 평균값은?", note: 절}

  - intent: w08_aug_sum_days
    cohorts: [aggregation_stage]
    expected_outcome: answered
    restores: a15_sum_count_last_month
    capability: "기간이 있는 한 단계 합계(D_no_bucket)"
    rationale: "'2026년 8월'은 기간, '합계'는 한 단계 sum. 운행일수는 택시별 기간 안 운행일을 센 뒤 aggregation으로 택시 전체를 모은다(업체 v2 README). 하루 값(택시마다 0/1)의 합은 기간 합과 같다."
    aggregation: {final: sum}
    expected_tool_args: {metric: operating_days, date: 20260801-20260831}
    must_include: [[2026년 8월], [합계], [운행일수]]
    must_exclude: [월별, 달마다]
    golden:
      concepts:
        - {id: op, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: days, concept: AMOUNT, subtype: operating_days, role: MEASURE, source: implicit}
      factors: {date: 20260801-20260831}
    paraphrases:
      - {id: w08_p0, question: "2026년 8월 택시 운행일수의 합계는?", note: 원문}
      - {id: w08_p1, question: "택시 운행일수의 2026년 8월 합계는?", note: 어순}
      - {id: w08_p2, question: "2026년 8월의 택시 운행일수 합계는 얼마인가요?", note: 절}

  - intent: w09_jul_aug_private_month_sum_then_avg_days
    cohorts: [aggregation_stage, taxi_type]
    expected_outcome: answered
    restores: a17_private_month_sum_then_avg_count
    capability: "택시 유형 조건을 유지한 두 단계 집계(E_taxi_type)"
    rationale: "taxi_type=private는 조건이지 개념이 아니다. 구간 안 sum, 구간별 값 avg. 운행일수는 택시별 기간 안 운행일을 센 뒤 aggregation으로 택시 전체를 모은다(업체 v2 README). 하루 값(택시마다 0/1)의 합은 기간 합과 같다."
    aggregation: {bucket: month, inner: sum, final: avg}
    expected_tool_args: {metric: operating_days, date: 20260701-20260831, taxi_type: private}
    must_include: [[2026년 7월부터 8월까지], [개인택시], [달마다], [합한], [평균], [운행일수]]
    must_exclude: [법인]
    golden:
      concepts:
        - {id: op, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: days, concept: AMOUNT, subtype: operating_days, role: MEASURE, source: implicit}
      factors: {date: 20260701-20260831, taxi_type: private}
    paraphrases:
      - {id: w09_p0, question: "2026년 7월부터 8월까지 개인택시 운행일수를 달마다 합한 값의 평균은?", note: 원문}
      - {id: w09_p1, question: "개인택시 운행일수를 2026년 7월부터 8월까지 달마다 합한 값의 평균은?", note: 어순}
      - {id: w09_p2, question: "2026년 7월부터 8월까지 달마다 합한 개인택시 운행일수의 평균은?", note: 절}

  - intent: w10_last_month_corporate_week_unspecified_max_vacant
    cohorts: [aggregation_stage, taxi_type]
    expected_outcome: needs_clarification
    restores: a18_corporate_week_unspecified_max_hours
    capability: "택시 유형 조건과 구간 안 집계 미지정(E_taxi_type + B)"
    rationale: "구간 안 집계가 질문에 없다. 합계·평균·최댓값 중 무엇인지 정해지지 않아 제품은 AMBIGUOUS_INNER_AGGREGATION으로 사용자 확인을 요청한다(Tool 기본값 avg를 쓰지 않음). 비율의 구간 안 집계도 질문이 정하지 않았다."
    aggregation: {bucket: week, inner: unspecified, final: max}
    expected_tool_args: {metric: vacant_ratio, date: last_month, taxi_type: corporate}
    must_include: [[지난달], [법인택시], [주별], [공차율], [최댓값]]
    must_exclude: [개인, 평균, 합]
    golden:
      concepts:
        - {id: drive, concept: EVENT, subtype: drive, role: SUPPORT, source: implicit}
        - {id: ratio, concept: PROPORTION, subtype: vacant_ratio, role: MEASURE, source: implicit}
      factors: {date: last_month, taxi_type: corporate}
    paraphrases:
      - {id: w10_p0, question: "지난달 법인택시의 주별 공차율 최댓값은?", note: 원문}
      - {id: w10_p1, question: "법인택시의 지난달 주별 공차율 최댓값은?", note: 어순}
      - {id: w10_p2, question: "지난달 주별 공차율 최댓값을 법인택시 기준으로 알려줘", note: 절}

  # --- B. local aggregation holdout 복원 (v1 l02·l03·l04·l07·l08·l10·l12·l13·l15·l20) ---

  - intent: w11_jul_aug_month_sum_then_max_fare
    cohorts: [aggregation_stage]
    trigger_expected: true
    expected_outcome: answered
    restores: l02_month_sum_then_max_count
    capability: "'합산하면 그중' 어순에서 구간 안 sum과 구간별 max를 나누는지"
    rationale: "구간 안 sum, 구간별 값의 max(값). fare는 trip 기록마다의 요금이라 합·최대·최소가 기록에 바로 정의된다(geoflow/measures.py EXTENSIVE_VALUE)."
    aggregation: {bucket: month, inner: sum, final: max}
    expected_tool_args: {metric: fare, date: 20260701-20260831}
    must_include: [[2026년 7월부터 8월까지], [월마다], [합산], [최댓값], [요금]]
    golden:
      concepts:
        - {id: trip, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: fare, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: 20260701-20260831}
