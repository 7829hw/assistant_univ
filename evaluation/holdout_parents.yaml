# taxi_type 문구 검증용 holdout 부모 질의.
#
# evaluation/paraphrases.yaml(선택용)과 겹치지 않는 새 의도다. 선택용 결과를 보기
# 전에 작성해 고정했다. 이 결과를 보고 문구를 다시 고치지 않는다.
#
# 형식은 stub_query_boundary.yaml과 같다. 기존 stub 파일은 다른 benchmark가
# 쓰므로 거기에 더하지 않는다.
#
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다.

# --- taxi_type 값 x 측정값 x 위치 x 범위 ---
