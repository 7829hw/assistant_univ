# evaluation/grounding_v1/holdout_questions.yaml
#
# grounding 개선(2026-09-29)의 독립 평가셋. 후보를 이 셋으로 실행하기 전에 고정했다.
# 규칙과 사용 제한은 evaluation/grounding_v1/preregistration.md.
#
# - 작성: Claude. 사람 검토 없음(unreviewed). 업체 정답이 아니다.
# - 업체 100문항과 문장·조건 조합이 다르다. 장소는 mock gazetteer에 있는 이름만 쓴다.
# - gold 표기는 evaluation/vendor100/gold.yaml과 같다: `tool(k=v, ...)` 줄, 장소 결과는
#   $resolve/$pickup/$dropoff/$area.scope. 기본값(taxi_type=all 등)은 적지 않는다.
# - expected_outcome이 answered가 아니면 gold 호출이 없고, 결과 종류만 채점한다.

version: grounding_v1_holdout
status: preregistered
items:
  - id: g01
    question: "지난달 부산 수영구의 공차 개인택시 통행량은?"
    gold_text: |-
      get_place_scope(name=수영구, region=부산)
      get_passage_count(scope=$resolve.scope, date=last_month, taxi_type=private, taxi_status=vacant)
  - id: g02
    question: "2026년 7월 3일 오전 9시부터 11시까지 동성로의 실차 통행량은?"
    gold_text: |-
      get_place_scope(name=동성로)
      get_passage_count(scope=$resolve.scope, date=20260703, time=090000-110000, taxi_status=occupied)
  - id: g03
    question: "휴일 대구 달서구의 대기영업 법인택시 통행량은?"
    gold_text: |-
      get_place_scope(name=달서구, region=대구)
      get_passage_count(scope=$resolve.scope, date=holiday, taxi_type=corporate, taxi_status=stationary)
  - id: g04
    question: "주중 대구의 시군구별 실차 택시 통행량이 가장 많은 곳은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_passage_count(scope=$resolve.scope, date=weekday, taxi_status=occupied, dimension=sigungu, order=top, limit=1)
  - id: g05
    question: "이번 주 부산 초읍동 어린이대공원 근처의 공차 택시 통행량은?"
    gold_text: |-
      get_place_scope(name=어린이대공원, region=부산 초읍동, include_vicinity=true)
      get_passage_count(scope=$resolve.scope, date=this_week, taxi_status=vacant)
  - id: g06
    question: "지난 주 대구 중구의 읍면동별 법인택시 통행량 하위 2곳은?"
    gold_text: |-
      get_place_scope(name=중구, region=대구)
      get_passage_count(scope=$resolve.scope, date=last_week, taxi_type=corporate, dimension=emd, order=bottom, limit=2)
  - id: g07
    question: "주말 오후 2시부터 5시까지 광안리 주변의 평균 속도는?"
    gold_text: |-
      get_place_scope(name=광안리, include_vicinity=true)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=weekend, time=140000-170000, aggregation=avg)
  - id: g08
    question: "2026년 7월 1일부터 7일까지 대구 수성구의 RPM 최댓값은?"
    gold_text: |-
      get_place_scope(name=수성구, region=대구)
      get_passage_metrics(metric=rpm, scope=$resolve.scope, date=20260701-20260707, aggregation=max)
  - id: g09
    question: "지난달 동대구역의 속도 중간값은?"
    gold_text: |-
      get_place_scope(name=동대구역)
      get_passage_metrics(metric=speed, scope=$resolve.scope, date=last_month, aggregation=med)
  - id: g10
    question: "지난달 대구 동인동에서 출발해 대구 두류동에 도착한 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=동인동, region=대구)
      get_place_scope(name=두류동, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_month)
  - id: g11
    question: "주말 부산 초량동으로 들어온 실차 구간 건수는?"
    gold_text: |-
      get_place_scope(name=초량동, region=부산)
      get_trip_count(scope_dropoff=$dropoff.scope, date=weekend)
  - id: g12
    question: "이번 달 대구에서 승차가 가장 많은 읍면동은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$pickup.scope, date=this_month, dimension=emd, dimension_target=pickup, order=top, limit=1)
  - id: g13
    question: "지난 주 부산에서 출발해 대구에 도착한 실차 중 도착 읍면동 상위 2곳은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_week, dimension=emd, dimension_target=dropoff, order=top, limit=2)
  - id: g14
    question: "휴일 오전 7시부터 9시까지 대구 안에서 이용이 가장 적은 읍면동 간 노선 2개는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_trip_count(scope_pickup=$area.scope, scope_dropoff=$area.scope, date=holiday, time=070000-090000, dimension=emd, dimension_target=both, order=bottom, limit=2)
  - id: g15
    question: "지난해 시군구 간 택시 OD 노선 중 가장 많이 이용된 2개는?"
    gold_text: |-
      get_trip_count(date=last_year, dimension=sigungu, dimension_target=both, order=top, limit=2)
  - id: g16
    question: "대구 신천동에서 출발한 실차 구간의 하차 읍면동 하위 3곳은?"
    gold_text: |-
      get_place_scope(name=신천동, region=대구)
      get_trip_count(scope_pickup=$pickup.scope, dimension=emd, dimension_target=dropoff, order=bottom, limit=3)
  - id: g17
    question: "지난달 서울 소속 개인택시의 평균 요금은?"
    expected_outcome: unsupported
    why: "get_trip_metrics는 taxi_type을 받지 않는다. 택시 유형 조건을 버리고 답하면 안 된다(UNCONSUMED_CONDITION)"
    gold_grounding:
      concepts:
        - {id: place, concept: LOCATION, subtype: place, role: SUBCOND, source: user, value: {name: 서울, region: ""}}
        - {id: event, concept: EVENT, subtype: trip, role: SUPPORT, source: implicit}
        - {id: measure, concept: AMOUNT, subtype: fare, role: MEASURE, source: implicit}
      factors: {date: last_month, taxi_type: private, aggregation: avg}
  - id: g18
    question: "2026년 7월 5일 오후 6시부터 9시까지 부산 소속 택시의 요금 중간값은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_trip_metrics(metric=fare, scope=$resolve.scope, date=20260705, time=180000-210000, aggregation=med)
  - id: g19
    question: "올해 인천 소속 택시의 최대 요금은?"
    gold_text: |-
      get_place_scope(name=인천)
      get_trip_metrics(metric=fare, scope=$resolve.scope, date=this_year, aggregation=max)
  - id: g20
    question: "지난 주 서울 소속 법인택시의 공차율 최솟값은?"
    gold_text: |-
      get_place_scope(name=서울)
      get_drive_metrics(metric=vacant_ratio, scope=$resolve.scope, date=last_week, taxi_type=corporate, aggregation=min)
  - id: g21
    question: "주말 대구 소속 택시의 평균 공차율은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_drive_metrics(metric=vacant_ratio, scope=$resolve.scope, date=weekend, aggregation=avg)
  - id: g22
    question: "이번 달 개인택시 공차율의 중간값은?"
    gold_text: |-
      get_drive_metrics(metric=vacant_ratio, date=this_month, taxi_type=private, aggregation=med)
  - id: g23
    question: "지난달 부산 소속 법인택시의 총 수입은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_billing_metrics(metric=revenue, scope=$resolve.scope, date=last_month, taxi_type=corporate, aggregation=sum)
  - id: g24
    question: "올해 요일별 개인택시 평균 가동률이 가장 낮은 요일은?"
    gold_text: |-
      get_billing_metrics(metric=active_taxi_ratio, date=this_year, taxi_type=private, aggregation=avg, dimension=dayofweek, order=bottom, limit=1)
  - id: g25
    question: "지난 주 시도별 법인택시 평균 활성택시 대수 상위 2곳은?"
    gold_text: |-
      get_billing_metrics(metric=active_taxi_count, date=last_week, taxi_type=corporate, aggregation=avg, dimension=sido, order=top, limit=2)
  - id: g26
    question: "이번 달 대구 소속 택시의 평균 운행 일수는?"
    gold_text: |-
      get_place_scope(name=대구)
      get_billing_metrics(metric=operating_days, scope=$resolve.scope, date=this_month, aggregation=avg)
  - id: g27
    question: "지난달 개인택시의 주별 총 수입 중 가장 큰 값은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_month, taxi_type=private, aggregation=sum, bucket=week, rollup=max)
  - id: g28
    question: "올해 서울 소속 택시의 월별 평균 가동률 중 가장 낮은 값은?"
    gold_text: |-
      get_place_scope(name=서울)
      get_billing_metrics(metric=active_taxi_ratio, scope=$resolve.scope, date=this_year, aggregation=avg, bucket=month, rollup=min)
  - id: g29
    question: "지난해 부산 소속 개인택시의 월별 수입 합계의 평균은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_billing_metrics(metric=revenue, scope=$resolve.scope, date=last_year, taxi_type=private, aggregation=sum, bucket=month, rollup=avg)
  - id: g30
    question: "이번 달 법인택시의 주별 최대 활성택시 대수의 중간값은?"
    gold_text: |-
      get_billing_metrics(metric=active_taxi_count, date=this_month, taxi_type=corporate, aggregation=max, bucket=week, rollup=med)
  - id: g31
    question: "지난달 대구 소속 택시의 주별 평균 운행 일수 중 가장 큰 값은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_billing_metrics(metric=operating_days, scope=$resolve.scope, date=last_month, aggregation=avg, bucket=week, rollup=max)
  - id: g32
    question: "지난달 대구 소속 택시의 수입 합계가 가장 큰 주는?"
    expected_outcome: unsupported
    why: "값이 아니라 구간(주)을 묻는다. bucket/rollup은 스칼라만 반환하고, 로컬 재계산 근거(day_records)가 없다"
    # flat grounding은 구간 선택을 표현하지 못한다(정답 grounding 없음, 정답 grounding 층에서 제외).
  - id: g33
    question: "지난달 시도별 개인택시 총 수입이 가장 많은 곳은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=last_month, taxi_type=private, aggregation=sum, dimension=sido, order=top, limit=1)
  - id: g34
    question: "scope:district:2726000000의 지난 주 실차 법인택시 통행량은?"
    gold_text: |-
      get_passage_count(scope=scope:district:2726000000, date=last_week, taxi_type=corporate, taxi_status=occupied)
  - id: g35
    question: "scope:district:2723010200에서 출발해 scope:district:2617010100에 도착한 실차 구간 건수는?"
    gold_text: |-
      get_trip_count(scope_pickup=scope:district:2723010200, scope_dropoff=scope:district:2617010100)
  - id: g36
    question: "scope:edge:1742가 어디인지 알려줘."
    gold_text: |-
      get_scope_name(scope=scope:edge:1742)
  - id: g37
    question: "대구 중앙로동의 택시 통행량은?"
    gold_text: |-
      get_place_scope(name=중앙로동, region=대구)
      get_passage_count(scope=$resolve.scope)
  - id: g38
    question: "부산진구 소속 택시의 평균 요금은?"
    gold_text: |-
      get_place_scope(name=부산진구)
      get_trip_metrics(metric=fare, scope=$resolve.scope, aggregation=avg)
  - id: g39
    question: "주중 오전 8시부터 10시까지 대구 태평로동의 평균 RPM은?"
    gold_text: |-
      get_place_scope(name=태평로동, region=대구)
      get_passage_metrics(metric=rpm, scope=$resolve.scope, date=weekday, time=080000-100000, aggregation=avg)
  - id: g40
    question: "지난달 대구에서 출발해 부산에 도착한 실차의 승차 읍면동 하위 2곳은?"
    gold_text: |-
      get_place_scope(name=대구)
      get_place_scope(name=부산)
      get_trip_count(scope_pickup=$pickup.scope, scope_dropoff=$dropoff.scope, date=last_month, dimension=emd, dimension_target=pickup, order=bottom, limit=2)
  - id: g41
    question: "지난달 대구 소속 개인택시에 대해 주 단위 평균 가동률을 구하고 그중 최솟값을 알려줘."
    gold_text: |-
      get_place_scope(name=대구)
      get_billing_metrics(metric=active_taxi_ratio, scope=$resolve.scope, date=last_month, taxi_type=private, aggregation=avg, bucket=week, rollup=min)
  - id: g42
    question: "올해 법인택시 수입을 달마다 모두 더한 값 가운데 가장 작은 값은?"
    gold_text: |-
      get_billing_metrics(metric=revenue, date=this_year, taxi_type=corporate, aggregation=sum, bucket=month, rollup=min)
  - id: g43
    question: "이번 달 부산 소속 택시의 주별 평균 운행 일수들의 중간값은?"
    gold_text: |-
      get_place_scope(name=부산)
      get_billing_metrics(metric=operating_days, scope=$resolve.scope, date=this_month, aggregation=avg, bucket=week, rollup=med)
  - id: g44
    question: "지난달 주별 개인택시 수입의 평균은?"
    expected_outcome: needs_clarification
    why: "각 주 안에서 수입을 합할지 평균할지(구간 안 집계)가 질문에 없다. 기본값으로 채우지 않는다"
    gold_grounding:
      concepts:
        - {id: event, concept: EVENT, subtype: operation, role: SUPPORT, source: implicit}
        - {id: measure, concept: AMOUNT, subtype: revenue, role: MEASURE, source: implicit}
      factors: {date: last_month, taxi_type: private, bucket: week, rollup: avg}
