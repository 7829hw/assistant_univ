# 두 단계 집계 grounding(H0 vs H2) 검증용 fresh holdout 부모 질의.
#
# H2 arm을 구현하거나 어떤 결과를 보기 전에 작성해 고정했다. 이 결과를 보고
# 문구를 고치지 않는다. development corpus의 집계 의도(b21, b24, h12, f13, f01,
# f02, f03)와 문장을 겹치지 않게 썼다.
#
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다.

# --- A. 구간 안 집계와 최종 집계를 모두 말한다 ---
- id: a01_week_sum_then_avg_hours
  question: "주별로 합한 영업 시간의 평균은?"
  expected_concepts: [EVENT/operation:SUPPORT, AMOUNT/hours:MEASURE]
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

- id: a02_month_sum_then_max_revenue
  question: "매달 합산한 수입 중 가장 큰 값은?"
  expected_concepts: [EVENT/operation:SUPPORT, AMOUNT/revenue:MEASURE]
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

- id: a03_week_max_then_avg_revenue
