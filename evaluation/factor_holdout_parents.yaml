# 50fae72 factor 안내 검증용 holdout 부모 질의.
#
# development corpus(evaluation/paraphrases.yaml, paraphrases_holdout.yaml)와
# 겹치지 않는 새 의도다. factorial development 측정을 돌리기 전에 작성해 고정했다.
# 이 결과를 보고 문구를 고치지 않는다.
#
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다.

# --- 두 단계 집계. 구간 안 집계(aggregation)와 구간 사이 집계(rollup)가 다르다 ---
- id: f01_month_sum_then_avg_revenue
  question: "월 단위로 합산한 택시 수입의 평균은?"
  expected_concepts: [EVENT/operation:SUPPORT, AMOUNT/revenue:MEASURE]
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

- id: f02_week_avg_then_max_hours
  question: "주 단위로 평균 낸 영업 시간의 최대값은?"
  expected_concepts: [EVENT/operation:SUPPORT, AMOUNT/hours:MEASURE]
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

# --- 구간 집계. rollup을 빠뜨리기 쉬운 표현 ---
- id: f03_month_sum_operating_count
  question: "월 단위 영업 횟수의 합계는?"
  expected_concepts: [EVENT/operation:SUPPORT, AMOUNT/operating_count:MEASURE]
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

- id: f13_week_avg_corporate_operating_count
