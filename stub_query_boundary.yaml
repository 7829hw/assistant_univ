# 합성 경계를 찌르는 평가 셋.
# stub_query.yaml은 각 질의가 곧바로 합성되도록 구성되어 있어 변별력이 낮다.
# 이 파일은 구분이 어려운 쌍과 지원 범위 밖 질의를 모아, 틀린 계획을 만드는
# 대신 계획 생성을 포기하는지까지 측정한다.
#
# expected_macros: [NONE] 은 "실행 가능한 계획이 만들어지면 안 됨"을 뜻한다.


# --- 내부 vs 주변 ---
- id: b01_place_inside_speed
  question: "동대구역의 평균 속도는?"
  expected_concepts:
    - LOCATION/place:SUBCOND
    - EVENT/passage:SUPPORT
    - AMOUNT/speed:MEASURE
  expected_macros: [PLACE_TO_SCOPE, EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, PASSAGE_METRIC]

- id: b02_vicinity_count
  question: "동대구역 주변 통행량은?"
  # vicinity factor만 다르고 개념 구조는 b01과 같다.
  expected_concepts:
    - LOCATION/place:SUBCOND
    - EVENT/passage:SUPPORT
    - AMOUNT/passage_count:MEASURE
  expected_macros: [PLACE_TO_SCOPE, EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, PASSAGE_COUNT]


# --- 측정값 종류 ---
- id: b03_direct_scope_rpm
  question: "scope:edge:1742의 분당 회전 속도는?"
  expected_concepts:
    - LOCATION/scope:COND
    - EVENT/passage:SUPPORT
