# --- 개체별 측정값 혼동 유도 ---
- id: b04_operating_ratio_by_day
  question: "요일별 택시 운행률은?"
  # 운행률은 operation이다. drive의 공차율과 바꿔 쓰면 안 된다.
  expected_concepts:
    - EVENT/operation:SUPPORT
    - PROPORTION/operating_ratio:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [OPERATION_METRIC]

- id: b05_corporate_vacant_ratio
  question: "법인택시의 공차율은?"
  # 공차율은 drive다. operation의 운행률과 바꿔 쓰면 안 된다.
  expected_concepts:
    - EVENT/drive:SUPPORT
    - PROPORTION/vacant_ratio:MEASURE
  expected_macros: [EVENT_TO_MEASURE]
  expected_operators: [DRIVE_METRIC]

- id: b06_fare_max
  question: "대구 택시 요금의 최대값은?"
  # 요금은 trip이다. operation의 수입과 바꿔 쓰면 안 된다.
  expected_concepts:
    - LOCATION/place:SUBCOND
    - EVENT/trip:SUPPORT
    - AMOUNT/fare:MEASURE
  expected_macros: [PLACE_TO_SCOPE, EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, TRIP_METRIC]

- id: b07_hours_by_sido
