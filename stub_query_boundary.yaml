# template 경계를 찌르는 평가 셋.
# stub_query.yaml은 각 질의가 정확히 하나의 template에 대응하도록 구성되어 있어
# 변별력이 낮다. 이 파일은 구분이 어려운 쌍과 지원 범위 밖 질의를 모아
# Planner가 틀린 template을 고르는 대신 거부하는지까지 측정한다.
#
# expected_template: NONE 은 "지원하는 template이 없으므로 거부해야 함"을 뜻한다.

# --- 내부 vs 주변 ---
- id: b01_place_inside_speed
  question: "동대구역의 평균 속도는?"
  expected_template: PLACE_SCOPE_METRIC

- id: b02_vicinity_count
  question: "동대구역 주변 통행량은?"
  expected_template: VICINITY_PASSAGE_COUNT

# --- metric vs count ---
- id: b03_direct_scope_rpm
  question: "scope:edge:1742의 분당 회전 속도는?"
  expected_template: DIRECT_SCOPE_METRIC

# --- 개체별 metric 혼동 유도 ---
- id: b04_operating_ratio_by_day
  question: "요일별 택시 운행률은?"
  expected_template: GROUPED_AGGREGATE

- id: b05_corporate_vacant_ratio
  question: "법인택시의 공차율은?"
  expected_template: DRIVE_RATIO_METRIC

- id: b06_fare_max
  question: "대구 택시 요금의 최대값은?"
  expected_template: TRIP_FARE_METRIC

- id: b07_hours_by_sido
  question: "시도별 택시 영업시간은?"
  expected_template: GROUPED_AGGREGATE

# --- 상대 날짜 ---
- id: b08_relative_date_speed
  question: "지난달 대구 지역 평균 속도는?"
  expected_template: PLACE_SCOPE_METRIC

# --- 지원 범위 밖: 거부해야 함 ---
- id: b09_place_passage_count
  question: "대구 지역 전체 통행량은?"
  expected_template: PLACE_PASSAGE_COUNT

- id: b10_revenue_without_grouping
  question: "개인택시의 평균 수입은?"
  expected_template: OPERATION_METRIC

# --- 지원 범위 밖: 거부해야 함 ---

- id: b11_origin_only
  question: "동성로동에서 출발한 실차 구간 건수는?"
  expected_template: OD_TRIP_COUNT

# --- 지원 범위 밖: 거부해야 함 ---
- id: b12_out_of_domain
  question: "오늘 서울 날씨 알려줘"
  expected_template: NONE

# ============================================================
# 지원 범위 안이지만 slot 조합이 까다로운 질의
# ============================================================

- id: b13_vicinity_vacant_count
  question: "동대구역 근처 공차 택시의 통행량은?"
  expected_template: VICINITY_PASSAGE_COUNT

- id: b14_operating_count_private
  question: "부산 개인택시의 영업 횟수는?"
  expected_template: OPERATION_METRIC

- id: b15_fare_median
  question: "대구 택시 요금의 중간값은?"
  expected_template: TRIP_FARE_METRIC

- id: b16_weekend_speed
  question: "주말 대구 지역의 평균 속도는?"
  expected_template: PLACE_SCOPE_METRIC

# ============================================================
# 지원 범위 밖: 거부해야 함
# Tool은 지원하지만 이를 노출하는 template이 아직 없는 경우를 포함한다.
# 틀린 template을 고르는 것보다 거부가 낫다는 주장을 측정한다.
# ============================================================

# 도착지만 주어짐. OD_TRIP_COUNT는 출발지가 필수다.
# 도착지를 origin에 넣어버리는지 확인한다.
- id: b17_destination_only
  question: "신천동에 도착한 실차 구간 건수는?"
  expected_template: NONE

# 순위 질의이지만 지역이 주어지지 않았다. get_passage_count는 scope가 필수라
# 어떤 template으로도 scope를 확보할 수 없다. 설계상의 경계다.
- id: b18_passage_count_ranking
  question: "통행량이 가장 많은 시군구 3곳은?"
  expected_template: NONE

- id: b19_scope_to_name
  question: "scope:district:2700000000은 어디인가요?"
  expected_template: SCOPE_PLACE_NAME

# 두 지역 비교. 단일 template으로 표현할 수 없다.
- id: b20_region_comparison
  question: "대구와 부산 중 어디가 택시 평균 속도가 더 빠른가요?"
  expected_template: NONE

- id: b21_bucket_rollup
  question: "주 단위로 집계한 택시 수입의 평균은?"
  expected_template: OPERATION_METRIC

- id: b24_bucket_rollup_month
  question: "월 단위로 집계한 개인택시 수입의 최대값은?"
  expected_template: OPERATION_METRIC

- id: b22_passage_count_by_sigungu
  question: "대구 시군구별 통행량은?"
  expected_template: PLACE_PASSAGE_COUNT

- id: b23_passage_count_ranking_with_region
  question: "대구에서 통행량이 가장 많은 시군구 3곳은?"
