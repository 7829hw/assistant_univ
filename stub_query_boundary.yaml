  # 합성이 되므로 이제 지원 범위 안이다.
  expected_concepts:
    - LOCATION/place:SUBCOND
    - EVENT/trip:SUPPORT
    - AMOUNT/trip_count:MEASURE
  expected_macros: [PLACE_TO_SCOPE, OD_EVENT_TO_MEASURE]
  expected_operators: [RESOLVE_PLACE_SCOPE, TRIP_COUNT]


