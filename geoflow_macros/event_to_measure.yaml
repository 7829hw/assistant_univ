# geoflow_macros/event_to_measure.yaml
# EVENT (+ 선택적 공간 조건) -> AMOUNT | PROPORTION.
#
# fare/speed/revenue/vacant_ratio마다 조각을 따로 두지 않는다. 그 차이는
# concept subtype이 나타내고, 어떤 Tool을 부를지는 operator mapping 단계가
# (EVENT subtype, 출력 concept/subtype)으로 결정한다. 그래서 이 조각 하나가
# 기존 통행 통계/통행량/요금/공차율/영업 통계 template을 모두 대신한다.
#
# 원시 값을 한 번 집계하는 경우(aggregation=scalar)만 다룬다. 공간 그룹화와
# 순위(dimension, order, limit)는 이 변환의 factor다. 결과가 곧 그룹별 분포이고
# 그 뒤에 다시 합치는 단계가 없어서, 한 변환으로 표현해도 계산 순서를 잃지 않는다.
#
# 시간 구간으로 나눈 뒤 다시 합치거나 고르는 두 단계 집계는 이 조각이 아니라
# EVENT_TO_GROUPED_MEASURE가 중간 개념(구간별 값)을 두고 표현한다. 예전에는
# bucket·rollup도 이 변환의 factor였고, 계산 순서가 Tool 인자 셋으로 압축되었다.

name: EVENT_TO_MEASURE
description: 사건(passage/trip/drive/operation)에서 통계값을 구한다. 공간 조건이 있으면 그 범위로 한정한다.
priority: 10
aggregation: scalar

inputs:
  event:
    concept: EVENT
    subtypes: [passage, trip, drive, operation]
    roles: [SUPPORT]
  area:
    concept: LOCATION
    subtypes: [scope, vicinity_scope]
    roles: [COND]
    required: false
    # 승하차 구분이 붙은 범위는 OD 변환이 다룬다.
    attributes:
      od_role: null

outputs:
  measure:
    types:
      - concept: AMOUNT
        subtypes:
          - speed
          - rpm
          - passage_count
          - trip_count
          - fare
          - revenue
          - operating_count
          - hours
      - concept: PROPORTION
        subtypes: [vacant_ratio, operating_ratio]

concepts:
  - key: measure
    role: MEASURE
    source: tool

transformations:
  - id: measure_event
    inputs: [event, area]
    output: measure
