# pilot_005 V3 약한 DPO(결정 101, PROTOCOL_v5 2절). qwen3_8b_t2pc_thinking_pilot004_dpo.yaml과 같은 설정이고, 바꾼 것은 출발 adapter(pilot_004 SFT checkpoint-934),
# 학습률 절반(1e-5 → 5e-6), 학습 길이 절반(1 → 0.5 epoch: max_steps = ceil(0.5 × 385) = 193), 출력 위치뿐이다. 저장 50%와 100%(save_steps 0.5 → 97, 마지막 step 193).
# full_response(결정 26), reference는 출발 SFT를 미리 계산(결정 9). seed 42. PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.
model:
  name_or_path: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  initial_mode: sft
  trust_remote_code: false
  load_in_4bit: false
  attn_implementation: sdpa
  adapter_path: /home/hwkim/sftdpo_work/pilot_004/checkpoints/sft/checkpoint-934
reference:
  mode: initial_policy
  strategy: precompute
data:
  train: training/generated/thinking_pilot004_t2pc/dpo_train.jsonl
  valid: training/generated/thinking_pilot004_t2pc/dpo_valid.jsonl
  manifest: training/generated/thinking_pilot004_t2pc/manifest.json
chat_template_kwargs:
  enable_thinking: true
training:
  output_dir: /home/hwkim/sftdpo_work/pilot_005/checkpoints/v3
  num_train_epochs: 0.5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-06
  warmup_ratio: 0
  beta: 0.1
  max_prompt_length: 7424
  max_completion_length: 4096
  max_length: 11392
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_total_limit: 6
  logging_steps: 1
  report_to: none
  seed: 42
  use_logits_to_keep: true
  precompute_ref_log_probs: true
  optim: adamw_torch
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  torch_compile: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_steps: 2
  save_steps: 0.5
  warmup_steps: 1
  disable_tqdm: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
safety:
  unified_memory: false
  reserve_fraction: 0.2
  reserve_gib: 16
  min_disk_gib: 20
profiling:
  enabled: true
  output: /home/hwkim/sftdpo_work/pilot_005/metrics/v3_profile.json
thinking:
  loss_scope: full_response
