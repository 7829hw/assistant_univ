# p0_sft_001 clean_hybrid SFT(결정 68). qwen3_8b_t2pc_thinking_pilot002_sft.yaml(pilot_001·002 승인 recipe, 결정 24·28·53)과 같은 설정이고,
# 바꾼 것은 데이터(P0 contract, clean_hybrid)와 출력 위치뿐이다. json_only, 2 epoch·0.25마다 저장, lr·warmup·LoRA·seed·길이 한도 그대로(탐색 없음).
# 두 arm(gold_only·clean_hybrid)은 data·output 경로만 다르다. PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True(결정 17).
model:
  name_or_path: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  trust_remote_code: false
  load_in_4bit: false
  attn_implementation: sdpa
data:
  train: training/generated/p0_sft_001/clean_hybrid/sft_train.jsonl
  valid: training/generated/p0_sft_001/clean_hybrid/sft_valid.jsonl
  manifest: training/generated/p0_sft_001/clean_hybrid/manifest.json
  contract: p0
  p0_prompt: evaluation/partial_grounding/prompts/partial_p0.yaml
  p0_prompt_sha256_prefix: d7f4c12a
chat_template_kwargs:
  enable_thinking: true
training:
  output_dir: /data/hwkim/p0_sft_001/checkpoints/clean_hybrid
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-05
  warmup_ratio: 0
  max_seq_length: 11392
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_total_limit: 6
  logging_steps: 1
  report_to: none
  seed: 42
  optim: adamw_torch
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  torch_compile: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_steps: 2
  save_steps: 0.25
  warmup_steps: 1
  disable_tqdm: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
safety:
  unified_memory: false
  reserve_fraction: 0.2
  reserve_gib: 16
  min_disk_gib: 20
profiling:
  enabled: true
  output: /data/hwkim/p0_sft_001/metrics/clean_hybrid_sft_profile.json
thinking:
  loss_scope: json_only
