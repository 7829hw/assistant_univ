# Two optimizer steps, one validation sample, one final adapter save.
model:
  name_or_path: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  trust_remote_code: false
  load_in_4bit: false
  attn_implementation: sdpa
data:
  train: training/generated/sft_train.jsonl
  valid: training/generated/sft_valid.jsonl
  manifest: training/generated/manifest.json
  max_valid_samples: 1
chat_template_kwargs:
  enable_thinking: false
training:
  output_dir: training/checkpoints/thor_smoke_sft
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  warmup_ratio: 0.05
  max_seq_length: 6912
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: 'no'
  save_total_limit: 1
  logging_steps: 1
  report_to: none
  seed: 42
  optim: adamw_torch
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  torch_compile: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_steps: 2
  eval_steps: 2
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
safety:
  unified_memory: true
  reserve_fraction: 0.2
  reserve_gib: 16
  min_disk_gib: 20
profiling:
  enabled: true
