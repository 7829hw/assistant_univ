# pipeline_pilot_001 SFT(DECISIONS.md 2026-10-06). qwen3_8b_t2pc_thinking_sft.yaml에서 데이터 경로(결정 4·6·7·8을
# 적용한 thinking_v003_t2pc_pilot), thinking.loss_scope(결정 3: full_response), 출력 위치(저장소 밖)만 바꿨다.
# 학습률·step·LoRA·seed는 thor pilot_003 profile 그대로다(탐색 없음). valid split은 비어 있어 trainer 평가는 꺼진다.
model:
  name_or_path: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  trust_remote_code: false
  load_in_4bit: false
  attn_implementation: sdpa
data:
  train: training/generated/thinking_v003_t2pc_pilot/sft_train.jsonl
  valid: training/generated/thinking_v003_t2pc_pilot/sft_valid.jsonl
  manifest: training/generated/thinking_v003_t2pc_pilot/manifest.json
chat_template_kwargs:
  enable_thinking: true
training:
  output_dir: /home/hwkim/sftdpo_work/pipeline_pilot_001/checkpoints/sft
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-05
  warmup_ratio: 0
  max_seq_length: 9216
  bf16: true
  fp16: false
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_total_limit: 6
  logging_steps: 1
  report_to: none
  seed: 42
  optim: adamw_torch
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  torch_compile: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_steps: 12
  eval_steps: 2
  save_steps: 2
  warmup_steps: 1
  disable_tqdm: true
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
safety:
  unified_memory: false
  reserve_fraction: 0.2
  reserve_gib: 16
  min_disk_gib: 20
profiling:
  enabled: true
  output: /home/hwkim/sftdpo_work/pipeline_pilot_001/metrics/sft_profile.json
thinking:
  loss_scope: full_response
