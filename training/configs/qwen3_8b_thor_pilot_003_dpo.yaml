  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
safety:
  unified_memory: true
  reserve_fraction: 0.2
  reserve_gib: 16
  min_disk_gib: 20
profiling:
  enabled: true
  output: training/experiments/thor_pilot_003/metrics/dpo_profile.json
