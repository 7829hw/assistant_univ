# schemas/tims.yaml
# 대용량 운행/과금 로그를 집계하는 tool 군.
# dimension / bucket / rollup / metric / taxi_status는 tool마다 허용 집합이 다르므로
# _common.yaml로 빼지 않고 각 tool에 직접 정의한다.

- type: function
  function:
    name: get_passage_count
    description: |
      조건에 맞는 passage 개수(택시 통행량)를 반환한다.
      반환: [ { "scope": "scope:...", "count": 12345 } ]
      dimension 미지정 시 원소 1개만 반환된다.
    parameters:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          $ref: "#/$defs/pt_scope"
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        taxi_type:
          $ref: "#/$defs/pt_taxi_type"
        taxi_status:
          type: string
          enum: [occupied, vacant, stationary, all]
          default: all
          description: "택시 상태. occupied=실차, vacant=공차, stationary=대기영업, all=조건 미적용."
        dimension:
          type: string
          enum: [h3, sido, sigungu, emd]
          description: "공간 집계 기준(pt_dimension). 지정 시 항목별 목록 반환."
        order:
          $ref: "#/$defs/pt_order"
        limit:
          $ref: "#/$defs/pt_limit"

- type: function
  function:
    name: get_passage_metrics
    description: "조건에 맞는 passage들의 통계값을 반환한다. 반환: 스칼라값."
    parameters:
      type: object
      additionalProperties: false
      required: [metric, scope]
      properties:
        metric:
          type: string
          enum: [speed, rpm]
          description: "통계 대상. speed=속도, rpm=분당 회전 속도."
        scope:
          $ref: "#/$defs/pt_scope"
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        aggregation:
          $ref: "#/$defs/pt_aggregation"

- type: function
  function:
    name: get_trip_count
    description: |
      승하차 등의 여러 조건에 해당하는 실차 구간(trip) 건수를 반환
      반환: [ { "scope_pickup": "scope:...", "scope_dropoff": "scope:...", "count": 678 } ]
    parameters:
      type: object
      additionalProperties: false
      properties:
        scope_pickup:
          $ref: "#/$defs/pt_scope"
          description: 승차 위치(출발지)에 대한 scope. scope:로 시작하는 문자열. 직접 생성 금지. 생략 가능
        scope_dropoff:
          $ref: "#/$defs/pt_scope"
          description: 하차 위치(도착지)에 대한 scope. scope:로 시작하는 문자열. 직접 생성 금지. 생략 가능
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        dimension:
          type: string
          enum: [h3, sido, sigungu, emd]
          description: "승하차 공간 집계 기준(pt_dimension). 지정 시 항목별 목록 반환."
        order:
          $ref: "#/$defs/pt_order"
        limit:
          $ref: "#/$defs/pt_limit"

- type: function
  function:
    name: get_trip_metrics
    description: "실차 운행 구간(trip)의 통계값을 반환한다. 반환: 스칼라값."
    parameters:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
        metric:
          type: string
          enum: [fare]
          description: "통계 대상. fare=택시 요금."
        scope:
          $ref: "#/$defs/pt_scope"
          description: "택시 소속 지역(pt_scope). scope:로 시작하는 문자열. 직접 생성 금지."
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        aggregation:
          $ref: "#/$defs/pt_aggregation"

- type: function
  function:
    name: get_drive_metrics
    description: |
      택시 기동부터 운행 종료까지 전체 운행 경로(drive)의 통계값을 반환한다.
      반환: 스칼라값.
    parameters:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
        metric:
          type: string
          enum: [vacant_ratio]
          description: "통계 대상. vacant_ratio=공차율."
        scope:
          $ref: "#/$defs/pt_scope"
          description: "택시 소속 지역(pt_scope). scope:로 시작하는 문자열. 직접 생성 금지."
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        taxi_type:
          $ref: "#/$defs/pt_taxi_type"
        aggregation:
          $ref: "#/$defs/pt_aggregation"

- type: function
  function:
    name: get_operation_metrics
    description: |
      일 단위 택시 영업(operation) 관련 통계값을 반환한다. 주별·월별 집계 가능.
      반환값: dimension 미지정 시 스칼라값,
            지정 시 [ { <dimension명>: "scope:...", <metric명>: 0.912 } ]
    parameters:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
        metric:
          type: string
          enum: [revenue, operating_count, operating_ratio, hours]
          description: 통계 대상. revenue=1일 수익금, operating_count=운행 건수, operating_ratio=운행률
            aggregation과 무관하게 개별 택시 1일 영업간 집계시, 운행 건수는 합산이며, 윤행률은 평균임
            운행률은 기간으로 합산하면 평균 운행일이 산출됨
        scope:
          $ref: "#/$defs/pt_scope"
          description: "운행 택시 소속 지역(pt_scope). scope:로 시작하는 문자열. 직접 생성 금지."
        date:
          $ref: "#/$defs/pt_date"
        taxi_type:
          $ref: "#/$defs/pt_taxi_type"
        dimension:
          type: string
          enum: [h3, sido, sigungu, emd, dayofweek]
          description: >-
            집계 기준(pt_dimension). 공간 단위 또는 dayofweek=요일별.
            일 단위 데이터이므로 hourofday는 사용할 수 없다.
            scope가 설정되지 않은 경우는 sido, dayofweek만 가능함
        order:
          $ref: "#/$defs/pt_order"
        limit:
          $ref: "#/$defs/pt_limit"
        aggregation:
          $ref: "#/$defs/pt_aggregation"
        bucket:
          type: string
          enum: [week, month]
          description: "1차 집계 시간 구간(pt_bucket). 지정 시 rollup 필수. 일 단위이므로 day 불가."
        rollup:
          type: string
          enum: [max, min, sum, avg, med]
          description: "bucket별 값들을 단일 값으로 합치는 2차 집계(pt_rollup)."
