# schemas/tims.yaml
# 대용량 운행/과금 로그를 집계하는 tool 군.
# dimension / bucket / rollup / metric / taxi_status는 tool마다 허용 집합이 다르므로
# _common.yaml로 빼지 않고 각 tool에 직접 정의한다.

- type: function
  function:
    name: get_passage_count
    description: |
      조건에 맞는 passage 개수(택시 통행량)를 반환한다.
      반환값 형식: dimension 지정 여부에 따라 상이함
        - dimension 미지정시: { "count": 12345 }
        - dimension 지정시: [ { <dimension>: <분류 지역명>, "count": 12345 } ... ]
    parameters:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          $ref: "#/$defs/pt_scope"
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        taxi_type:
          $ref: "#/$defs/pt_taxi_type"
        taxi_status:
          type: string
          enum: [occupied, vacant, stationary, all]
          default: all
          description: "택시 상태. occupied=실차, vacant=공차, stationary=대기영업, all=조건 미적용."
        dimension:
          type: string
          enum: [h3, sido, sigungu, emd]
          description: 설정시 dimension별로 집계된 목록 반환. pt_dimension 형식 참고.
             일반적으로 운행 지역은 읍면동(emd)를 사용함
        order:
          $ref: "#/$defs/pt_order"
        limit:
          $ref: "#/$defs/pt_limit"

- type: function
  function:
    name: get_passage_metrics
    description: "조건에 맞는 passage들의 통계값을 반환한다. 반환: 스칼라값."
    parameters:
      type: object
      additionalProperties: false
      required: [metric, scope]
      properties:
        metric:
          type: string
          enum: [speed, rpm]
          description: "통계 대상. speed=속도, rpm=분당 회전 속도."
        scope:
          $ref: "#/$defs/pt_scope"
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        aggregation:
          $ref: "#/$defs/pt_aggregation"

- type: function
  function:
    name: get_trip_count
    description: |
      승하차 등의 여러 조건에 해당하는 실차 구간(trip) 건수를 반환.
      반환값 형식: dimension 지정 여부와 dimension 지정시는 dimension_target에 따라 결정
        - dimension 미지정시: { "count": 678 }
        - dimension_target 지정시:
          - both: [ { "pickup": <승차지역명>, "dropoff": <하차지역명>, "count": 678 } ]
          - pickup: [ { "pickup": <승차지역명>, "count": 678 } ]
          - dropoff: [ { "dropoff": <하차지역명>, "count": 678 } ]
    parameters:
      type: object
      additionalProperties: false
      properties:
        scope_pickup:
          $ref: "#/$defs/pt_scope"
          description: 승차 위치(출발지)에 대한 scope. scope:로 시작하는 문자열. 직접 생성 금지. 생략 가능
        scope_dropoff:
          $ref: "#/$defs/pt_scope"
          description: 하차 위치(도착지)에 대한 scope. scope:로 시작하는 문자열. 직접 생성 금지. 생략 가능
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        dimension:
          type: string
          enum: [h3, sido, sigungu, emd]
          description: >-
            승하차 공간 집계 기준(pt_dimension). 지정 시 항목별 목록 반환.
            dimension_target에 따라 dimension이 적용될 대상이 결정됨
        dimension_target:
          type: string
          enum: [pickup, dropoff, both]
          default: both
          description: |-
            dimension에 따른 집계가 적용될 scope
              pickup: 승차 위치별 집계
              dropoff: 하차 위치별 집계
              both: 승차지-하차지 조합(OD pair)별 집계. 생략 시 기본값
        order:
          $ref: "#/$defs/pt_order"
        limit:
          $ref: "#/$defs/pt_limit"

- type: function
  function:
    name: get_trip_metrics
    description: "실차 운행 구간(trip)의 통계값을 반환한다. 반환: 스칼라값."
    parameters:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
        metric:
          type: string
          enum: [fare]
          description: "통계 대상. fare=택시 요금."
        scope:
          $ref: "#/$defs/pt_scope"
          description: "택시 소속 지역(pt_scope). scope:로 시작하는 문자열. 직접 생성 금지."
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        aggregation:
          $ref: "#/$defs/pt_aggregation"

- type: function
  function:
    name: get_drive_metrics
    description: |
      택시 기동부터 운행 종료까지 전체 운행 경로(drive)의 통계값을 반환한다.
      반환: 스칼라값.
    parameters:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
        metric:
          type: string
          enum: [vacant_ratio]
          description: "통계 대상. vacant_ratio=공차율."
        scope:
          $ref: "#/$defs/pt_scope"
          description: "택시 소속 지역(pt_scope). scope:로 시작하는 문자열. 직접 생성 금지."
        date:
          $ref: "#/$defs/pt_date"
        time:
          $ref: "#/$defs/pt_time"
        taxi_type:
          $ref: "#/$defs/pt_taxi_type"
        aggregation:
          $ref: "#/$defs/pt_aggregation"

- type: function
  function:
    name: get_billing_metrics
    description: |
      일 단위 택시 영업(operation) 관련 통계값을 반환한다.
      dimension을 통해 행정구역별, 요일별 통계 목록 제공
      bucket/rollup을 통해 주별·월별 집계 가능
      반환값: dimension 미지정 시 스칼라값,
            지정 시 [ { <dimension명>: <분류값>, <metric명>: 0.912 } ]
    parameters:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
        metric:
          type: string
          enum: [revenue, active_taxi_count, active_taxi_ratio, operating_days]
          description: 통계 대상. revenue=1일 수익금, active_taxi_count=활성택시 댓수, active_taxi_ratio=가동률, operating_days=운행일
            실제 택시가 통행한 지역이 아닌 택시의 소속 지역 기준으로 산출함
        scope:
          $ref: "#/$defs/pt_scope"
          description: 택시 소속 지역(pt_scope). 직접 생성 금지
        date:
          $ref: "#/$defs/pt_date"
        taxi_type:
          $ref: "#/$defs/pt_taxi_type"
        dimension:
          type: string
          enum: [h3, sido, sigungu, emd, dayofweek]
          description: >-
            설정시 dimension에 지정된 단위로 집계된 목록을 반환. pt_dimension 형식 참고.
            scope에 대한 통계를 추출하는 경우는 dimension 설정 금지
            scope가 설정되지 않은 경우는 sido, dayofweek만 가능함
        order:
          $ref: "#/$defs/pt_order"
        limit:
          $ref: "#/$defs/pt_limit"
        aggregation:
          $ref: "#/$defs/pt_aggregation"
        bucket:
          type: string
          enum: [week, month]
          description: "1차 집계 시간 구간(pt_bucket). 지정 시 rollup 필수. 일 단위이므로 day 불가."
        rollup:
          type: string
          enum: [max, min, sum, avg, med]
          description: "bucket별 값들을 단일 값으로 합치는 2차 집계(pt_rollup)."
